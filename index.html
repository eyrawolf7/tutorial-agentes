<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Anatomía de un belt · Guía para managers</title>
<style>
:root{--bg:#1E1B31;--bg2:#17152A;--card:#28253F;--card2:#221F38;--line:#3A3658;--txt:#F4F6FF;--lav:#D1D8ED;--mute:#9A9CB8;--turq:#00E6D9;--blue:#3366FF;--dark:#1E1B31;
--sys:#8C8FB0;--tool:#D1D8ED;--perm:#FF4D56;--instr:#00E6D9;--cmd:#F7C948;--skill:#8B8DF7;--sub:#FF7AB6;--mcp:#4FA3FF;--hook:#FF9F43;
--sans:"Figtree","Sofia Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--lav);font:17px/1.6 var(--sans)}
header{position:sticky;top:0;z-index:20;height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;background:#000;color:#fff;font:600 14px/1 var(--sans)}
header span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header b{color:var(--turq);font-weight:700}
#cnt{color:var(--mute);font-variant-numeric:tabular-nums}
#bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--turq)}
#stagecol{position:sticky;top:46px;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 8px 10px}
#stage{display:block;width:100%;height:auto;max-height:44vh;max-height:44dvh;margin:0 auto}
#cap{display:flex;gap:10px;align-items:flex-start;margin-top:6px;padding:9px 11px;min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:12px}
#capWho{flex:none;margin-top:1px;padding:3px 8px;border-radius:6px;font:700 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase}
#capTxt{font:500 16px/1.38 var(--sans);color:var(--txt)}
main{min-width:0}
.part{padding:38px 20px 0}
.part span{display:inline-block;padding:4px 10px;border-radius:6px;background:var(--turq);color:var(--dark);font:700 12px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.part b{display:block;margin-top:12px;font:700 28px/1.12 var(--sans);color:#fff;letter-spacing:-.02em;border-bottom:1px solid var(--line);padding-bottom:16px}
.ch{padding:26px 20px 40px;min-height:66vh;min-height:66dvh;opacity:.3;transition:opacity .4s}
.ch.act{opacity:1}.ch.free{min-height:0}
.kick{display:flex;align-items:center;gap:9px;margin:0 0 10px;font:700 12px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.kick i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
h1,h2{font-family:var(--sans);font-weight:700;letter-spacing:-.025em;margin:0 0 14px;color:#fff}
h1{font-size:42px;line-height:1.05}
h1 em{font-style:normal;color:var(--turq)}
h2{font-size:30px;line-height:1.12}
p{margin:0 0 14px}
.lead{font-size:17.5px;color:var(--lav)}
.who{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;font:500 14px/1.3 var(--sans)}
.who span{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2)}
.who b{color:var(--c)}
.note{padding:12px 16px;border-left:4px solid var(--c);border-radius:0 12px 12px 0;background:var(--card2);font:500 16.5px/1.45 var(--sans);color:var(--txt)}
.ex{margin:0 0 16px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;font:12.5px/1.6 var(--mono);color:var(--lav);white-space:pre-wrap;overflow-wrap:anywhere}
.ex .l{display:block;margin-bottom:5px;font:700 11px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--turq)}
.ex .k{color:var(--c);font-weight:700}
.ex .bad{color:var(--perm)}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 15px/1 var(--sans);padding:12px 18px;min-height:46px;background:var(--turq);color:var(--dark);border:0;border-radius:12px;cursor:pointer}
.btn:after{content:"›";font-size:22px;line-height:0;margin-top:-2px}
.btn:active{transform:scale(.97)}
.road{list-style:none;padding:0;margin:20px 0;counter-reset:r}
.road li{counter-increment:r;display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font:600 17px/1.3 var(--sans);color:var(--txt)}
.road li:last-child{border-bottom:1px solid var(--line)}
.road li:before{content:counter(r);flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--turq);color:var(--dark);font:700 14px/1 var(--sans)}
.hint{font:700 13px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--turq);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 16px;font-size:14px;line-height:1.4;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;padding:9px 8px;background:var(--bg2);color:var(--turq);font:700 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.tbl td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;white-space:nowrap;color:var(--txt)}
.tbl i{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:3px;background:var(--c)}
.tbl code{font:12px var(--mono);overflow-wrap:anywhere}
.tl{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tl li{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:600 13px/1.2 var(--sans);opacity:.4;transition:.25s}
.tl li i{flex:none;width:9px;height:9px;border-radius:3px;background:var(--c)}
.tl li.on{opacity:1;background:var(--card);border-color:var(--c);color:var(--txt)}
.dec{list-style:none;margin:0 0 16px;padding:0}
.dec li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font:500 16px/1.35 var(--sans);color:var(--txt)}
.dec li:last-child{border-bottom:1px solid var(--line)}
.dec b{flex:none;font:700 13px/1.5 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--c)}
.q{margin:0 0 16px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.q .n{font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--turq)}
.q p.t{margin:8px 0 14px;font:600 19px/1.35 var(--sans);color:#fff}
.q .opt{display:flex;width:100%;text-align:left;margin:0 0 8px;background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:600}
.q .opt:after{content:none}
.q .opt.ok{background:var(--turq);color:var(--dark);border-color:var(--turq)}.q .opt.ko{background:var(--perm);color:#fff;border-color:var(--perm)}
.q .fb{margin:12px 0 0;font:500 16px/1.45 var(--sans);color:var(--txt)}
.foot{padding:10px 20px 60px;font:13px/1.5 var(--sans);color:var(--mute)}
/* escena */
.st{opacity:0;transition:opacity .55s}
.st.on{opacity:1}
.pl{animation:pl .45s ease-in-out 2;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.08)}}
.ln{fill:none;stroke:var(--lav);stroke-width:1.5;stroke-dasharray:3 4;opacity:.4}
.ln.live{stroke:var(--mcp);stroke-width:2.4;opacity:1;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.la{fill:none;stroke:var(--lav);stroke-width:2;marker-end:url(#ah)}
.ring{opacity:0;transition:opacity .2s;transform-box:fill-box;transform-origin:center}
.ring.on{opacity:1;animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cb{transition:transform .4s cubic-bezier(.3,.8,.3,1)}
/* ancho: escena a la izquierda */
@media (min-width:820px),(orientation:landscape) and (min-width:600px){
  .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr)}
  #stagecol{top:46px;height:calc(100vh - 46px);height:calc(100dvh - 46px);display:flex;flex-direction:column;justify-content:center;padding:14px 20px;border-bottom:0;border-right:1px solid var(--line)}
  #stage{max-height:calc(100dvh - 160px)}
  .ch{padding:40px 34px 50px;min-height:80vh;min-height:80dvh}.ch.free{min-height:0}
  .part{padding:48px 34px 0}
}
@media (min-width:820px){h1{font-size:50px}h2{font-size:34px}.ex{font-size:13px}}
@media (orientation:landscape) and (max-height:520px){
  #stage{max-height:calc(100dvh - 128px)}#cap{min-height:52px;padding:5px 8px}#capTxt{font-size:14.5px}
  .ch{padding:22px 20px}h1{font-size:30px}h2{font-size:24px}.lead{font-size:15.5px}
}
</style>
</head>
<body>
<header><span><b>SDG</b> · Anatomía de un belt</span><span id="cnt"></span><i id="bar"></i></header>
<div class="wrap">
  <div id="stagecol">
    <svg id="stage" viewBox="0 0 400 346" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama animado de un modelo de IA dentro de un harness, con sus herramientas y las piezas de un belt"></svg>
    <div id="cap"><span id="capWho"></span><span id="capTxt"></span></div>
  </div>
  <main id="chs"></main>
</div>

<script>
const K={ink:'#E8EBFA',dark:'#1E1B31',paper:'#1E1B31',card:'#2B2846',hz:'#23203A',tray:'#211E37',edge:'#4A4670',mute:'#8C8FB0',model:'#3366FF',
 sys:'#8C8FB0',tool:'#D1D8ED',perm:'#FF4D56',instr:'#00E6D9',cmd:'#F7C948',skill:'#8B8DF7',sub:'#FF7AB6',mcp:'#4FA3FF',hook:'#FF9F43'};
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);

/* ================= ESCENA ================= */
const R=(x,y,w,h,o={})=>{const {f=K.card,s=K.edge,sw=1.5,r=8,sh=false,dash='',id=''}=o;
 return (sh?`<rect x="${x+3}" y="${y+3}" width="${w}" height="${h}" rx="${r}" fill="${K.ink}"/>`:'')+
 `<rect${id?` id="${id}"`:''} x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"${dash?` stroke-dasharray="${dash}"`:''}/>`};
const T=(x,y,t,o={})=>{const {fs=11,w=700,c=K.ink,a='middle',f='sans',ls=0,id=''}=o;
 return `<text${id?` id="${id}"`:''} x="${x}" y="${y}" text-anchor="${a}" style="font:${w} ${fs}px var(--${f});fill:${c};letter-spacing:${ls}em">${t}</text>`};
const chip=(id,t,x,w,c=K.tool)=>`<g id="c-${id}">${R(x,280,w,26,{s:c,r:4,sh:false})}${T(x+w/2,297,t,{fs:10,f:'sans'})}</g>`;
const SYS=[['snow','Snowflake',150],['dbt','dbt',212],['pbi','Power BI',274],['jira','Jira',336]];
const SLOTS=[['instr','Instrucciones','siempre activas',K.instr,8],['cmd','Comandos','los lanzas tú',K.cmd,9],['skill','Skills','las elige el modelo',K.skill,10],
 ['sub','Subagentes','delega el modelo',K.sub,11],['mcp','MCP','conecta sistemas',K.mcp,12],['hook','Hooks','saltan solos',K.hook,13]];
const sXY=i=>({x:16+(i%3)*124,y:368+Math.floor(i/3)*36});
const pill=(id,x,y,t)=>`<g id="${id}"><rect x="${x-33}" y="${y-9}" width="66" height="18" rx="9" fill="${K.card}" stroke="${K.edge}" stroke-width="1.5"/>${T(x,y+3.5,t,{fs:9,ls:.1})}</g>`;

$('stage').innerHTML=`
<defs><marker id="ah" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="${K.ink}"/></marker></defs>

<g class="st" data-ch="1" id="g-sys">${T(271,12,'SISTEMAS DEL CLIENTE',{fs:8.5,ls:.12,c:K.mute})}
${SYS.map(([id,n,x])=>`<g id="sy-${id}">${R(x,20,58,32,{s:K.mcp,r:5})}${T(x+29,40,n,{fs:10,f:'sans'})}</g>`).join('')}</g>
<g class="st" data-r="1-3"><path d="M238 124 L186 56" fill="none" stroke="${K.perm}" stroke-width="2" stroke-dasharray="4 4"/>${T(216,70,'sin acceso',{a:'start',fs:9,c:K.perm})}</g>

<g class="st" data-ch="2">${R(8,76,384,260,{f:K.hz,r:16,dash:'6 5',s:K.edge})}${T(20,95,'HARNESS',{a:'start',fs:11,ls:.14})}${T(382,95,'Claude Code · Copilot · Cursor',{a:'end',fs:8.5,c:K.mute,w:600})}</g>
<g class="st" data-r="1-1"><path d="M56 46 Q170 60 228 132" class="ln"/></g>
<g class="st" data-ch="2"><path d="M48 55 L118 103" class="ln"/><path id="l-cm" d="M144 150 H224" class="ln"/></g>
<g class="st" data-ch="4"><path d="M262 188 V256" class="ln"/><path id="l-sys" d="M156 293 H150 V53" class="ln"/></g>

<g class="st" data-ch="2">${R(20,104,124,222,{r:8})}${T(30,119,'CONTEXTO',{a:'start',fs:9,ls:.12})}${T(134,119,'0 %',{a:'end',fs:9,id:'ctxpct',c:K.mute})}
<rect x="28" y="123" width="108" height="3" fill="${K.hz}"/><rect id="ctxmeter" x="28" y="123" width="0" height="3" fill="${K.ink}"/><g id="ctxblocks"></g></g>

<g class="st" data-ch="4">${R(156,256,228,64,{r:8})}${T(166,271,'EJECUTOR DE HERRAMIENTAS',{a:'start',fs:8,ls:.12,c:K.mute})}
${chip('sql','SQL',164,44)}${chip('py','Python',212,56)}${chip('files','Archivos',272,62)}</g>
<g class="st" data-ch="12">${chip('mcp','MCP',338,40,K.mcp)}</g>

<g class="st" data-r="5-5">
<path class="la" d="M346 120 Q380 176 356 229"/><path class="la" d="M318 250 Q262 270 216 247"/><path class="la" d="M176 226 Q170 112 282 108"/>
${pill('lp0',318,110,'DECIDE')}${pill('lp1',348,240,'EJECUTA')}${pill('lp2',184,236,'OBSERVA')}</g>

<g class="st" data-ch="11">${[124,184].map((cy,i)=>`<circle id="sr${i}" class="ring" cx="344" cy="${cy}" r="20" fill="none" stroke="${K.sub}" stroke-width="2" stroke-dasharray="3 5"/>
<circle cx="344" cy="${cy}" r="14" fill="${K.sub}"/>${T(344,cy+3.5,'sub',{fs:9.5,c:K.dark})}
${R(366,cy-18,18,36,{r:3,sh:false})}<rect id="sb${i}" x="368" y="${cy+16}" width="14" height="0" fill="${K.sub}"/>`).join('')}${T(350,219,'contexto propio',{fs:7.5,c:K.mute,w:600})}</g>

<g class="st" data-ch="6" id="g-gate"><rect id="gateR" x="216" y="219" width="92" height="22" rx="11" fill="${K.card}" stroke="${K.perm}" stroke-width="2"/>${T(262,234,'PERMISOS',{fs:9,c:K.perm,ls:.12,id:'gateT'})}</g>

<g class="st on">
<circle id="mring" class="ring" cx="262" cy="150" r="45" fill="none" stroke="${K.ink}" stroke-width="2.5" stroke-dasharray="3 7"/>
<circle cx="262" cy="150" r="41" fill="none" stroke="${K.model}" stroke-opacity=".35" stroke-width="4"/><circle id="mcirc" cx="262" cy="150" r="36" fill="${K.model}"/>
${T(262,156,'LLM',{fs:17,c:'#fff',ls:.06})}${T(262,204,'MODELO',{fs:9,ls:.14})}</g>
<g class="st on"><circle cx="34" cy="38" r="20" fill="${K.card}" stroke="${K.ink}" stroke-width="2"/><circle cx="34" cy="32" r="6.5" fill="${K.ink}"/><path d="M23 50 Q34 36 45 50Z" fill="${K.ink}"/>
${T(62,36,'TÚ',{a:'start',fs:11,ls:.12})}${T(62,49,'consultor/a',{a:'start',fs:8.5,c:K.mute,w:600})}</g>

<g class="st" data-ch="7">${R(8,344,384,98,{f:K.tray,r:16})}${T(20,360,'BELT',{a:'start',fs:11,ls:.14,c:K.instr})}${T(382,360,'kpi-analysis-belt',{a:'end',fs:9.5,c:K.mute,w:600})}
${SLOTS.map((s,i)=>{const p=sXY(i);return `<g id="ph${i}">${R(p.x,p.y,120,32,{f:'none',s:K.mute,dash:'4 3',sh:false,r:5,sw:1.5})}${T(p.x+60,p.y+20,s[1],{fs:10,c:K.mute,f:'sans',w:600})}</g>`}).join('')}</g>
${SLOTS.map((s,i)=>{const p=sXY(i);return `<g class="st" data-ch="${s[4]}" id="s-${s[0]}">${R(p.x,p.y,120,32,{r:5})}<rect x="${p.x}" y="${p.y}" width="6" height="32" rx="3" fill="${s[3]}"/>
${T(p.x+16,p.y+14,s[1],{a:'start',fs:10.5,f:'sans'})}${T(p.x+16,p.y+26,s[2],{a:'start',fs:8,c:K.mute,w:600})}</g>`}).join('')}

<g id="deny" style="display:none"><circle r="13" fill="${K.perm}" stroke="${K.ink}" stroke-width="2"/><path d="M-5 -5l10 10M5 -5l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
<g id="okm" style="display:none"><circle r="13" fill="${K.instr}" stroke="${K.ink}" stroke-width="2"/><path d="M-6 0l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
<g id="packets"></g>`;

/* ================= ANIMACIÓN ================= */
const P={u:{x:34,y:38},m:{x:262,y:150},ctx:{x:82,y:215},ex:{x:270,y:288},gate:{x:262,y:230},
 snow:{x:179,y:36},dbt:{x:241,y:36},pbi:{x:303,y:36},jira:{x:365,y:36},
 sql:{x:186,y:293},py:{x:240,y:293},files:{x:303,y:293},mcpc:{x:358,y:293},s1:{x:344,y:124},s2:{x:344,y:184}};
SLOTS.forEach((s,i)=>{const p=sXY(i);P[s[0]]={x:p.x+60,y:p.y+16}});
let tok=0;
const sleep=ms=>{const t=tok;return new Promise((r,j)=>setTimeout(()=>t===tok?r():j('x'),ms))};
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function fly(a,b,label,col,ms=900){
  a=P[a]||a;b=P[b]||b;
  const my=tok,g=document.createElementNS(NS,'g'),w=label.length*6+24,h=20,lt=col===K.card;
  g.innerHTML=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="7" fill="${col}"${lt?` stroke="${K.ink}" stroke-width="1.2"`:''}/>`+
   `<text y="3.8" text-anchor="middle" style="font:700 10.5px var(--sans);fill:${lt?K.ink:K.dark}">${label}</text>`;
  g.setAttribute('transform',`translate(${a.x},${a.y})`);$('packets').appendChild(g);
  return new Promise((res,rej)=>{const t0=performance.now();(function f(t){
    if(my!==tok){g.remove();return rej('x')}
    const p=Math.min(1,(t-t0)/ms),e=ease(p),arc=-Math.sin(Math.PI*p)*18;
    g.setAttribute('transform',`translate(${a.x+(b.x-a.x)*e},${a.y+(b.y-a.y)*e+arc})`);
    if(p<1)requestAnimationFrame(f);else{g.remove();res()}})(t0)});
}
const both=(...ps)=>Promise.all(ps);
function pulse(id){const e=$(id);if(!e)return;e.classList.remove('pl');void e.getBBox();e.classList.add('pl');setTimeout(()=>e.classList.remove('pl'),1000)}
async function think(ms=900,id='mring'){$(id).classList.add('on');await sleep(ms);$(id).classList.remove('on')}
async function mark(id,p,ms=1200){const e=$(id),q=P[p]||p;e.setAttribute('transform',`translate(${q.x},${q.y})`);e.style.display='';await sleep(ms);e.style.display='none'}
async function gate(col,ms=700){$('gateR').setAttribute('fill',col);$('gateT').style.fill=K.dark;pulse('g-gate');await sleep(ms);$('gateR').setAttribute('fill',K.card);$('gateT').style.fill=K.perm}
const WHO={tu:['Tú','#D1D8ED',K.dark],harness:['Harness','#54546A','#fff'],modelo:['Modelo',K.model,'#fff'],sub:['Subagente',K.sub,K.dark],hook:['Hook',K.hook,K.dark],perm:['Permisos',K.perm,'#fff'],plugin:['Belt',K.instr,K.dark]};
function say(w,t){const c=WHO[w];$('capWho').textContent=c[0];$('capWho').style.background=c[1];$('capWho').style.color=c[2];$('capTxt').textContent=t}
const loopHi=i=>[0,1,2].forEach(j=>{const g=$('lp'+j);g.firstElementChild.setAttribute('fill',j===i?K.instr:K.card);g.lastElementChild.style.fill=j===i?K.dark:K.ink});
const tl=n=>document.querySelectorAll('.tl li').forEach((li,i)=>li.classList.toggle('on',n>=0&&i<=n));
const live=on=>$('l-sys').classList.toggle('live',on);
function subFill(i,to,ms=1400){const r=$('sb'+i),cy=i?184:124,my=tok,from=+r.getAttribute('height'),t0=performance.now();
  return new Promise(res=>{(function f(t){if(my!==tok)return res();const p=Math.min(1,(t-t0)/ms),h=from+(to*32-from)*ease(p);
  r.setAttribute('height',h);r.setAttribute('y',cy+16-h);p<1?requestAnimationFrame(f):res()})(t0)})}

/* ventana de contexto */
const CTX={list:[],top:130,bot:318,x:28,w:108};
function ctxPush(k,label,c,h=16,soft=false,anim=false){
  const g=document.createElementNS(NS,'g');g.setAttribute('class','cb');
  const txt=soft?K.ink:K.dark;
  g.innerHTML=`<rect width="${CTX.w}" height="${h}" rx="3" fill="${c}" fill-opacity="${soft?.2:1}" stroke="${c}" stroke-width="1.5"/><text x="${CTX.w/2}" y="${h/2+3.2}" text-anchor="middle" style="font:700 9px var(--sans);fill:${txt}">${label}</text>`;
  $('ctxblocks').appendChild(g);const b={k,h,el:g,rect:g.firstChild,txt:g.lastChild};CTX.list.push(b);
  ctxRender();if(anim)g.animate([{opacity:0},{opacity:1}],{duration:380});return b;
}
function ctxRender(){
  const gap=3,tot=CTX.list.reduce((s,b)=>s+b.h+gap,0),avail=CTX.bot-CTX.top,k=Math.min(1,avail/(tot||1));
  let y=CTX.top;CTX.list.forEach(b=>{const h=Math.max(5,b.h*k);b.el.style.transform=`translate(${CTX.x}px,${y}px)`;
    b.rect.setAttribute('height',h);b.txt.setAttribute('y',h/2+3.2);b.txt.style.opacity=h<11?0:1;y+=h+gap*k});
  const pct=Math.min(100,Math.round(tot/avail*100));$('ctxpct').textContent=pct+' %';$('ctxmeter').setAttribute('width',108*pct/100);
}
function ctxClear(){CTX.list=[];$('ctxblocks').innerHTML='';ctxRender()}
function ctxDel(k){CTX.list=CTX.list.filter(b=>{if(b.k===k){b.el.remove();return false}return true});ctxRender()}
const ctxPulse=k=>{const b=CTX.list.find(b=>b.k===k);if(b)b.el.firstChild.animate([{strokeWidth:1.5},{strokeWidth:5},{strokeWidth:1.5}],{duration:700})};
const BASE={sys:['Sistema',K.sys,16],tools:['Herramientas',K.tool,12,1],instr:['Instrucciones',K.instr,22],skidx:['Índice de skills',K.skill,11,1],mcpt:['Herram. MCP',K.mcp,12,1]};
function base(...ks){ctxClear();ks.forEach(k=>{const [l,c,h,s]=BASE[k];ctxPush(k,l,c,h,!!s)})}
async function add(k,l,c,h=16,soft=false){ctxPush(k,l,c,h,soft,true);await sleep(380)}
async function send(ms=900){await fly('ctx','m','contexto',K.card,650);await think(ms)}

 {t:'Todos los análisis deben usar la definición de «cliente activo» del cliente.',o:['Instrucciones','Skill','Hook','Comando'],a:0,st:'s-instr',w:'Lo que hay que saber siempre va en las instrucciones.'},

 {t:'Queremos que el agente consulte el backlog del proyecto en Jira.',o:['Skill','Comando','MCP','Hook'],a:2,st:'s-mcp',w:'Conectar un sistema externo es trabajo de un servidor MCP.'},

let qi=0,score=0;
function quiz(){const q=QZ[qi],el=$('quiz');
  if(!q){el.innerHTML=`<div class="q"><span class="n">Resultado</span><p class="t">${score} de ${QZ.length}</p><p class="fb">${score>=5?'Ya piensas en piezas. Buena señal para la próxima reunión con el equipo técnico.':'Repasa la chuleta: la clave es quién activa cada pieza.'}</p><button class="btn" data-act="qreset">Repetir el test</button></div>`;return}
  el.innerHTML=`<div class="q"><span class="n">Pregunta ${qi+1} de ${QZ.length}</span><p class="t">${q.t}</p>${q.o.map((o,i)=>`<button class="btn opt" data-act="ans" data-i="${i}">${o}</button>`).join('')}<div id="fb"></div></div>`}
quiz();
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='replay')enter(cur,true);
  if(a==='qreset'){qi=0;score=0;quiz()}
  if(a==='next'){qi++;quiz()}
  if(a==='ans'){const q=QZ[qi],i=+b.dataset.i,box=b.parentElement;if(box.dataset.done)return;box.dataset.done=1;
    box.querySelectorAll('.opt').forEach((o,k)=>{if(k===q.a)o.classList.add('ok');else if(k===i)o.classList.add('ko')});
    if(i===q.a)score++;pulse(q.st);
    $('fb').innerHTML=`<p class="fb">${i===q.a?'Correcto. ':'No exactamente. '}${q.w}</p><button class="btn" style="margin-top:10px" data-act="next">${qi<QZ.length-1?'Siguiente':'Ver resultado'}</button>`}
});

/* ---------- control por scroll ---------- */
let cur=-1,vh=346,vtok=0;
const secs=[...document.querySelectorAll('.ch')];
function setView(h){if(h===vh)return;const my=++vtok,from=vh,t0=performance.now();(function f(t){if(my!==vtok)return;const p=Math.min(1,(t-t0)/650);vh=from+(h-from)*ease(p);$('stage').setAttribute('viewBox',`0 0 400 ${vh.toFixed(1)}`);if(p<1)requestAnimationFrame(f)})(t0)}
function resetScene(){
  tok++;$('packets').innerHTML='';ctxClear();['mring','sr0','sr1'].forEach(id=>$(id).classList.remove('on'));
  [0,1].forEach(i=>{$('sb'+i).setAttribute('height',0);$('sb'+i).setAttribute('y',(i?184:124)+16)});
  $('deny').style.display='none';$('okm').style.display='none';$('gateR').setAttribute('fill',K.card);$('gateT').style.fill=K.perm;
  live(false);loopHi(-1);tl(-1);
}
function enter(i,force){
  if(i===cur&&!force)return;cur=i;resetScene();
  document.querySelectorAll('#stage .st').forEach(e=>{let on=true;
    if(e.dataset.r){const [a,b]=e.dataset.r.split('-').map(Number);on=i>=a&&i<=b}else if(e.dataset.ch)on=i>=+e.dataset.ch;
    e.classList.toggle('on',on)});
  setView(i>=7?448:346);
  secs.forEach((s,k)=>s.classList.toggle('act',k===i));
  $('cnt').textContent=String(i+1).padStart(2,'0')+' / '+CH.length;
  (async()=>{try{await sleep(450);await CH[i].demo()}catch(e){if(e!=='x')console.error(e)}})();
}
const wideMQ=matchMedia('(min-width:820px),(orientation:landscape) and (min-width:600px)');
function onScroll(){
  const line=wideMQ.matches?innerHeight*.45:$('stagecol').getBoundingClientRect().bottom+30;
  let a=0;secs.forEach((s,k)=>{if(s.getBoundingClientRect().top<=line)a=k});
  $('bar').style.width=(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)*100)+'%';
  enter(a);
}
let tick=false;addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(()=>{tick=false;onScroll()})}},{passive:true});
addEventListener('resize',onScroll);
enter(0,true);setTimeout(onScroll,60);
</script>
