<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anatomía de un belt · SDG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1B31;--bg2:#17152A;--card:#28253F;--card2:#221F38;--line:#3A3658;--txt:#F4F6FF;--lav:#D1D8ED;--mute:#9A9CB8;--turq:#00E6D9;--blue:#3366FF;--dark:#1E1B31;
--sys:#8C8FB0;--tool:#D1D8ED;--perm:#FF4D56;--instr:#00E6D9;--cmd:#F7C948;--skill:#8B8DF7;--sub:#FF7AB6;--mcp:#4FA3FF;--hook:#FF9F43;
--sans:"Figtree","Sofia Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--k:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;display:grid;place-items:center;font-family:var(--sans);-webkit-user-select:none;user-select:none}
#deck{position:relative;flex:none;width:1600px;height:900px;zoom:var(--k);background:var(--bg);color:var(--lav);overflow:hidden;cursor:pointer}
/* cabecera */
#top{position:absolute;inset:0 0 auto 0;height:60px;display:flex;align-items:center;padding:0 40px;background:#000;color:#fff;font:600 19px/1 var(--sans)}
#top .brand b{color:var(--turq);font-weight:800}
#part{position:absolute;left:50%;transform:translateX(-50%);font:700 14px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#right{margin-left:auto;display:flex;align-items:center;gap:18px}
#beats{display:flex;gap:6px}
#beats i{width:8px;height:8px;border-radius:50%;background:#3A3658}
#beats i.on{background:var(--turq)}
#cnt{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:700}
#nav{display:flex;gap:6px}
#nav button{width:34px;height:34px;border-radius:9px;border:1px solid #3A3658;background:#141226;color:var(--lav);font:700 18px/1 var(--sans);cursor:pointer}
#nav button:hover{background:var(--card)}
#bar{position:absolute;left:0;top:60px;height:3px;background:var(--turq);transition:width .4s}
/* zonas */
#stage{position:absolute;left:40px;top:78px;width:640px;height:706px}
#panel{position:absolute;left:730px;top:96px;width:830px;height:684px;overflow:hidden}
#pin{--fz:1;font-size:calc(22px*var(--fz))}
#cap{position:absolute;left:40px;top:800px;width:1520px;height:74px;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--card);border:1px solid var(--line);border-radius:14px}
#capWho{flex:none;padding:6px 12px;border-radius:8px;font:800 15px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
#capTxt{font:500 24px/1.3 var(--sans);color:var(--txt)}
/* texto de la diapositiva */
.kick{display:flex;align-items:center;gap:.5em;margin:0 0 .7em;font-weight:700;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kick i{width:.8em;height:.8em;border-radius:.2em;background:var(--c);flex:none}
h1,h2{font-weight:800;letter-spacing:-.025em;margin:0 0 .45em;color:#fff}
h1{font-size:3.1em;line-height:1.02}
h1 em{font-style:normal;color:var(--turq)}
h2{font-size:2.15em;line-height:1.08}
p{margin:0 0 .75em}
.lead{font-size:1.08em;line-height:1.5;color:var(--lav)}
.who{display:flex;flex-wrap:wrap;gap:.45em;margin:0 0 .9em;font-size:.8em;font-weight:500}
.who span{padding:.35em .7em;border:1px solid var(--line);border-radius:.5em;background:var(--card2)}
.who b{color:var(--c)}
.note{padding:.6em .9em;border-left:4px solid var(--c);border-radius:0 .6em .6em 0;background:var(--card2);font-size:.95em;line-height:1.45;font-weight:500;color:var(--txt)}
.ex{margin:0 0 .8em;padding:.75em .95em;background:var(--bg2);border:1px solid var(--line);border-radius:.6em;font:.78em/1.55 var(--mono);color:var(--lav);white-space:pre-wrap}
.ex .l{display:block;margin-bottom:.35em;font:700 .8em/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--turq)}
.ex .bad{color:var(--perm)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8em}.two .ex{margin:0}
.rv{opacity:.18;transition:opacity .35s}.rv.on{opacity:1}
.list{list-style:none;margin:0 0 .9em;padding:0;counter-reset:r}
.list li{counter-increment:r;display:flex;gap:.7em;align-items:center;padding:.5em 0;border-top:1px solid var(--line);font-size:1em;font-weight:600;color:var(--txt)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list li:before{content:counter(r);flex:none;width:1.45em;height:1.45em;display:grid;place-items:center;border-radius:.35em;background:var(--turq);color:var(--dark);font-size:.8em;font-weight:800}
.rules{margin:0 0 .9em;border:1px solid var(--line);border-radius:.6em;overflow:hidden}
.rules div{display:flex;justify-content:space-between;padding:.55em .9em;border-top:1px solid var(--line);font-size:.92em;color:var(--txt)}
.rules div:first-child{border-top:0}
.rules b{color:var(--c)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 .9em;font-size:.8em;line-height:1.35;background:var(--card2);border:1px solid var(--line);border-radius:.6em;overflow:hidden}
.tbl th{text-align:left;padding:.55em .7em;background:var(--bg2);color:var(--turq);font-size:.8em;letter-spacing:.08em;text-transform:uppercase}
.tbl td{padding:.5em .7em;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;white-space:nowrap;color:var(--txt)}
.tbl i{display:inline-block;width:.6em;height:.6em;margin-right:.5em;border-radius:.15em;background:var(--c)}
.tbl code{font:.92em var(--mono)}
.tl{list-style:none;margin:0 0 .9em;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.tl li{display:flex;gap:.5em;align-items:center;padding:.45em .7em;border:1px solid var(--line);border-radius:.45em;font-size:.8em;font-weight:600;opacity:.35;transition:.25s}
.tl li i{flex:none;width:.6em;height:.6em;border-radius:.15em;background:var(--c)}
.tl li.on{opacity:1;background:var(--card);border-color:var(--c);color:var(--txt)}
.dec{list-style:none;margin:0 0 .9em;padding:0}
.dec li{display:flex;justify-content:space-between;align-items:center;gap:.6em;padding:.55em 0;border-top:1px solid var(--line);font-size:1em;font-weight:500;color:var(--txt)}
.dec li:last-child{border-bottom:1px solid var(--line)}
.dec b{flex:none;padding:.25em .6em;border-radius:.4em;background:var(--c);color:var(--dark);font-size:.72em;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.q .n{font-size:.72em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--turq)}
.q p.t{margin:.35em 0 .8em;font-size:1.35em;line-height:1.3;font-weight:700;color:#fff}
.q .opt{display:flex;align-items:center;gap:.7em;margin:0 0 .45em;padding:.6em .9em;background:var(--card2);border:1px solid var(--line);border-radius:.55em;font-size:1em;font-weight:600;color:var(--txt)}
.q .opt span{flex:none;width:1.5em;height:1.5em;display:grid;place-items:center;border-radius:.35em;background:var(--card);font-size:.75em;font-weight:800}
.q .opt.ok{background:var(--turq);border-color:var(--turq);color:var(--dark)}.q .opt.ok span{background:rgba(0,0,0,.15)}
.q .fb{margin:.7em 0 0;font-size:.95em;line-height:1.45;font-weight:500;color:var(--txt)}
/* escena */
.st{opacity:0;transition:opacity .55s}.st.on{opacity:1}
.pl{animation:pl .45s ease-in-out 2;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.08)}}
.ln{fill:none;stroke:var(--lav);stroke-width:1.5;stroke-dasharray:3 4;opacity:.4}
.ln.live{stroke:var(--mcp);stroke-width:2.4;opacity:1;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.la{fill:none;stroke:var(--lav);stroke-width:2;marker-end:url(#ah)}
.ring{opacity:0;transition:opacity .2s;transform-box:fill-box;transform-origin:center}
.ring.on{opacity:1;animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cb{transition:transform .4s cubic-bezier(.3,.8,.3,1)}
</style>
</head>
<body>
<div id="deck">
  <div id="top"><span class="brand"><b>SDG</b> · Anatomía de un belt</span><span id="part"></span>
    <div id="right"><div id="beats"></div><span id="cnt"></span><div id="nav"><button id="bPrev" aria-label="Anterior">‹</button><button id="bNext" aria-label="Siguiente">›</button></div></div></div>
  <i id="bar"></i>
  <svg id="stage" viewBox="0 0 400 346" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama animado de un modelo de IA dentro de un harness y las piezas de un belt"></svg>
  <div id="panel"><div id="pin"></div></div>
  <div id="cap"><span id="capWho"></span><span id="capTxt"></span></div>
</div>

<script>
const K={ink:'#E8EBFA',dark:'#1E1B31',card:'#2B2846',hz:'#23203A',tray:'#211E37',edge:'#4A4670',mute:'#8C8FB0',model:'#3366FF',
 sys:'#8C8FB0',tool:'#D1D8ED',perm:'#FF4D56',instr:'#00E6D9',cmd:'#F7C948',skill:'#8B8DF7',sub:'#FF7AB6',mcp:'#4FA3FF',hook:'#FF9F43'};
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);

/* ================= ESCENA ================= */
const R=(x,y,w,h,o={})=>{const {f=K.card,s=K.edge,sw=1.5,r=8,dash='',id=''}=o;
 return `<rect${id?` id="${id}"`:''} x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"${dash?` stroke-dasharray="${dash}"`:''}/>`};
const T=(x,y,t,o={})=>{const {fs=11,w=700,c=K.ink,a='middle',ls=0,id=''}=o;
 return `<text${id?` id="${id}"`:''} x="${x}" y="${y}" text-anchor="${a}" style="font:${w} ${fs}px var(--sans);fill:${c};letter-spacing:${ls}em">${t}</text>`};
const chip=(id,t,x,w,c=K.tool)=>`<g id="c-${id}">${R(x,280,w,26,{s:c,r:6})}${T(x+w/2,297,t,{fs:10.5})}</g>`;
const SYS=[['snow','Snowflake',150],['dbt','dbt',212],['pbi','Power BI',274],['jira','Jira',336]];
const SLOTS=[['instr','Instrucciones','siempre activas',K.instr,8],['cmd','Comandos','los lanzas tú',K.cmd,9],['skill','Skills','las elige el modelo',K.skill,10],
 ['sub','Subagentes','delega el modelo',K.sub,11],['mcp','MCP','conecta sistemas',K.mcp,12],['hook','Hooks','saltan solos',K.hook,13]];
const sXY=i=>({x:16+(i%3)*124,y:368+Math.floor(i/3)*36});
const pill=(id,x,y,t)=>`<g id="${id}"><rect x="${x-33}" y="${y-9}" width="66" height="18" rx="9" fill="${K.card}" stroke="${K.edge}" stroke-width="1.5"/>${T(x,y+3.5,t,{fs:9,ls:.1})}</g>`;

$('stage').innerHTML=`
<defs><marker id="ah" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="${K.ink}"/></marker></defs>
<g class="st" data-ch="1">${T(271,12,'SISTEMAS DEL CLIENTE',{fs:8.5,ls:.12,c:K.mute})}
${SYS.map(([id,n,x])=>`<g id="sy-${id}">${R(x,20,58,32,{s:K.mcp,r:7})}${T(x+29,40,n,{fs:10.5})}</g>`).join('')}</g>
<g class="st" data-r="1-3"><path d="M238 124 L186 56" fill="none" stroke="${K.perm}" stroke-width="2" stroke-dasharray="4 4"/>${T(216,70,'sin acceso',{a:'start',fs:9.5,c:K.perm})}</g>
<g class="st" data-ch="2">${R(8,76,384,260,{f:K.hz,r:16,dash:'6 5'})}${T(20,95,'HARNESS',{a:'start',fs:11,ls:.14})}${T(382,95,'Claude Code · Copilot · Cursor',{a:'end',fs:9,c:K.mute,w:600})}</g>
<g class="st" data-r="1-1"><path d="M56 46 Q170 60 228 132" class="ln"/></g>
<g class="st" data-ch="2"><path d="M48 55 L118 103" class="ln"/><path d="M144 150 H224" class="ln"/></g>
<g class="st" data-ch="4"><path d="M262 188 V256" class="ln"/><path id="l-sys" d="M156 293 H150 V53" class="ln"/></g>
<g class="st" data-ch="2">${R(20,104,124,222,{r:9})}${T(30,119,'CONTEXTO',{a:'start',fs:9.5,ls:.12})}${T(134,119,'0 %',{a:'end',fs:9.5,id:'ctxpct',c:K.mute})}
<rect x="28" y="123" width="108" height="3" rx="1.5" fill="${K.hz}"/><rect id="ctxmeter" x="28" y="123" width="0" height="3" rx="1.5" fill="${K.ink}"/><g id="ctxblocks"></g></g>
<g class="st" data-ch="4">${R(156,256,228,64,{r:9})}${T(166,271,'EJECUTOR DE HERRAMIENTAS',{a:'start',fs:8.5,ls:.12,c:K.mute})}
${chip('sql','SQL',164,44)}${chip('py','Python',212,56)}${chip('files','Archivos',272,62)}</g>
<g class="st" data-ch="12">${chip('mcp','MCP',338,40,K.mcp)}</g>
<g class="st" data-r="5-5">
<path class="la" d="M346 120 Q380 176 356 229"/><path class="la" d="M318 250 Q262 270 216 247"/><path class="la" d="M176 226 Q170 112 282 108"/>
${pill('lp0',318,110,'DECIDE')}${pill('lp1',348,240,'EJECUTA')}${pill('lp2',184,236,'OBSERVA')}</g>
<g class="st" data-ch="11">${[124,184].map((cy,i)=>`<circle id="sr${i}" class="ring" cx="344" cy="${cy}" r="20" fill="none" stroke="${K.sub}" stroke-width="2" stroke-dasharray="3 5"/>
<circle cx="344" cy="${cy}" r="14" fill="${K.sub}"/>${T(344,cy+3.5,'sub',{fs:9.5,c:K.dark})}
${R(366,cy-18,18,36,{r:4})}<rect id="sb${i}" x="368" y="${cy+16}" width="14" height="0" rx="2" fill="${K.sub}"/>`).join('')}${T(350,219,'contexto propio',{fs:8,c:K.mute,w:600})}</g>
<g class="st" data-ch="6" id="g-gate"><rect id="gateR" x="216" y="219" width="92" height="22" rx="11" fill="${K.card}" stroke="${K.perm}" stroke-width="2"/>${T(262,234,'PERMISOS',{fs:9.5,c:K.perm,ls:.12,id:'gateT'})}</g>
<g class="st on">
<circle id="mring" class="ring" cx="262" cy="150" r="46" fill="none" stroke="${K.ink}" stroke-width="2.5" stroke-dasharray="3 7"/>
<circle cx="262" cy="150" r="41" fill="none" stroke="${K.model}" stroke-opacity=".35" stroke-width="4"/><circle id="mcirc" cx="262" cy="150" r="36" fill="${K.model}"/>
${T(262,156,'LLM',{fs:17,c:'#fff',ls:.06})}${T(262,204,'MODELO',{fs:9.5,ls:.14})}</g>
<g class="st on"><circle cx="34" cy="38" r="20" fill="${K.card}" stroke="${K.ink}" stroke-width="2"/><circle cx="34" cy="32" r="6.5" fill="${K.ink}"/><path d="M23 50 Q34 36 45 50Z" fill="${K.ink}"/>
${T(62,36,'TÚ',{a:'start',fs:11,ls:.12})}${T(62,50,'consultor/a',{a:'start',fs:9,c:K.mute,w:600})}</g>
<g class="st" data-ch="7">${R(8,344,384,98,{f:K.tray,r:16})}${T(20,360,'BELT',{a:'start',fs:11,ls:.14,c:K.instr})}${T(382,360,'kpi-analysis-belt',{a:'end',fs:9.5,c:K.mute,w:600})}
${SLOTS.map((s,i)=>{const p=sXY(i);return `<g id="ph${i}">${R(p.x,p.y,120,32,{f:'none',s:K.mute,dash:'4 3',r:7})}${T(p.x+60,p.y+20,s[1],{fs:10.5,c:K.mute,w:600})}</g>`}).join('')}</g>
${SLOTS.map((s,i)=>{const p=sXY(i);return `<g class="st" data-ch="${s[4]}" id="s-${s[0]}">${R(p.x,p.y,120,32,{r:7})}<rect x="${p.x}" y="${p.y}" width="6" height="32" rx="3" fill="${s[3]}"/>
${T(p.x+15,p.y+14,s[1],{a:'start',fs:11})}${T(p.x+15,p.y+26,s[2],{a:'start',fs:8.5,c:K.mute,w:600})}</g>`}).join('')}
<g id="deny" style="display:none"><circle r="13" fill="${K.perm}" stroke="${K.dark}" stroke-width="2"/><path d="M-5 -5l10 10M5 -5l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
<g id="packets"></g>`;

/* ================= ANIMACIÓN ================= */
const P={u:{x:34,y:38},m:{x:262,y:150},ctx:{x:82,y:215},gate:{x:262,y:230},
 snow:{x:179,y:36},dbt:{x:241,y:36},pbi:{x:303,y:36},jira:{x:365,y:36},
 sql:{x:186,y:293},py:{x:240,y:293},files:{x:303,y:293},mcpc:{x:358,y:293},s1:{x:344,y:124},s2:{x:344,y:184}};
SLOTS.forEach((s,i)=>{const p=sXY(i);P[s[0]]={x:p.x+60,y:p.y+16}});
let tok=0,FAST=false;
const sleep=ms=>{const t=tok;if(FAST)return t===tok?Promise.resolve():Promise.reject('x');return new Promise((r,j)=>setTimeout(()=>t===tok?r():j('x'),ms))};
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function fly(a,b,label,col,ms=900){
  if(FAST)return sleep(0);
  a=P[a]||a;b=P[b]||b;
  const my=tok,g=document.createElementNS(NS,'g'),w=label.length*6+24,h=20,lt=col===K.card;
  g.innerHTML=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="7" fill="${col}"${lt?` stroke="${K.ink}" stroke-width="1.2"`:''}/>`+
   `<text y="3.8" text-anchor="middle" style="font:700 10.5px var(--sans);fill:${lt?K.ink:K.dark}">${label}</text>`;
  g.setAttribute('transform',`translate(${a.x},${a.y})`);$('packets').appendChild(g);
  return new Promise((res,rej)=>{const t0=performance.now();(function f(t){
    if(my!==tok){g.remove();return rej('x')}
    const p=Math.min(1,(t-t0)/ms),e=ease(p),arc=-Math.sin(Math.PI*p)*18;
    g.setAttribute('transform',`translate(${a.x+(b.x-a.x)*e},${a.y+(b.y-a.y)*e+arc})`);
    if(p<1)requestAnimationFrame(f);else{g.remove();res()}})(t0)});
}
const both=(...ps)=>Promise.all(ps);
function pulse(id){if(FAST)return;const e=$(id);if(!e)return;e.classList.remove('pl');void e.getBBox();e.classList.add('pl');setTimeout(()=>e.classList.remove('pl'),1000)}
async function think(ms=900,id='mring'){if(FAST)return sleep(0);$(id).classList.add('on');await sleep(ms);$(id).classList.remove('on')}
async function mark(p,ms=1200){if(FAST)return sleep(0);const e=$('deny'),q=P[p]||p;e.setAttribute('transform',`translate(${q.x},${q.y})`);e.style.display='';await sleep(ms);e.style.display='none'}
async function gate(col,ms=700){if(FAST)return sleep(0);$('gateR').setAttribute('fill',col);$('gateT').style.fill=K.dark;pulse('g-gate');await sleep(ms);$('gateR').setAttribute('fill',K.card);$('gateT').style.fill=K.perm}
const WHO={tu:['Tú','#D1D8ED',K.dark],harness:['Harness','#54546A','#fff'],modelo:['Modelo',K.model,'#fff'],sub:['Subagente',K.sub,K.dark],hook:['Hook',K.hook,K.dark],perm:['Permisos',K.perm,'#fff'],belt:['Belt',K.instr,K.dark]};
function say(w,t){const c=WHO[w];$('capWho').textContent=c[0];$('capWho').style.background=c[1];$('capWho').style.color=c[2];$('capTxt').textContent=t}
const loopHi=i=>[0,1,2].forEach(j=>{const g=$('lp'+j);g.firstElementChild.setAttribute('fill',j===i?K.instr:K.card);g.lastElementChild.style.fill=j===i?K.dark:K.ink});
const tl=n=>document.querySelectorAll('#pin .tl li').forEach((li,i)=>li.classList.toggle('on',n>=0&&i<=n));
const rv=n=>document.querySelectorAll('#pin .rv').forEach((e,i)=>e.classList.toggle('on',i<n));
const live=on=>$('l-sys').classList.toggle('live',on);
function subFill(i,to,ms=1400){const r=$('sb'+i),cy=i?184:124,set=h=>{r.setAttribute('height',h);r.setAttribute('y',cy+16-h)};
  if(FAST){set(to*32);return sleep(0)}
  const my=tok,from=+r.getAttribute('height'),t0=performance.now();
  return new Promise(res=>{(function f(t){if(my!==tok)return res();const p=Math.min(1,(t-t0)/ms);set(from+(to*32-from)*ease(p));p<1?requestAnimationFrame(f):res()})(t0)})}
async function subsWork(a,b,ms){$('sr0').classList.add('on');$('sr1').classList.add('on');await both(subFill(0,a,ms),subFill(1,b,ms),sleep(ms));$('sr0').classList.remove('on');$('sr1').classList.remove('on')}

/* ventana de contexto */
const CTX={list:[],top:130,bot:318,x:28,w:108};
function ctxPush(k,label,c,h=16,soft=false){
  const g=document.createElementNS(NS,'g');g.setAttribute('class','cb');
  g.innerHTML=`<rect width="${CTX.w}" height="${h}" rx="3.5" fill="${c}" fill-opacity="${soft?.2:1}" stroke="${c}" stroke-width="1.5"/><text x="${CTX.w/2}" y="${h/2+3.2}" text-anchor="middle" style="font:700 9.5px var(--sans);fill:${soft?K.ink:K.dark}">${label}</text>`;
  $('ctxblocks').appendChild(g);CTX.list.push({k,h,el:g,rect:g.firstChild,txt:g.lastChild});
  ctxRender();if(!FAST)g.animate([{opacity:0},{opacity:1}],{duration:380});
}
function ctxRender(){
  const gap=3,tot=CTX.list.reduce((s,b)=>s+b.h+gap,0),avail=CTX.bot-CTX.top,k=Math.min(1,avail/(tot||1));
  let y=CTX.top;CTX.list.forEach(b=>{const h=Math.max(5,b.h*k);b.el.style.transform=`translate(${CTX.x}px,${y}px)`;
    b.rect.setAttribute('height',h);b.txt.setAttribute('y',h/2+3.3);b.txt.style.opacity=h<11?0:1;y+=h+gap*k});
  const pct=Math.min(100,Math.round(tot/avail*100));$('ctxpct').textContent=pct+' %';$('ctxmeter').setAttribute('width',108*pct/100);
}
function ctxClear(){CTX.list=[];$('ctxblocks').innerHTML='';ctxRender()}
function ctxDel(k){CTX.list=CTX.list.filter(b=>{if(b.k===k){b.el.remove();return false}return true});ctxRender()}
const ctxPulse=k=>{if(FAST)return;const b=CTX.list.find(b=>b.k===k);if(b)b.el.firstChild.animate([{strokeWidth:1.5},{strokeWidth:5},{strokeWidth:1.5}],{duration:700})};
const BASE={sys:['Sistema',K.sys,16],tools:['Herramientas',K.tool,12,1],instr:['Instrucciones',K.instr,22],skidx:['Índice de skills',K.skill,11,1],mcpt:['Herram. MCP',K.mcp,12,1]};
function base(...ks){ctxClear();ks.forEach(k=>{const [l,c,h,s]=BASE[k];ctxPush(k,l,c,h,!!s)})}
async function add(k,l,c,h=16,soft=false){ctxPush(k,l,c,h,soft);await sleep(380)}
async function send(ms=900){await fly('ctx','m','contexto',K.card,650);await think(ms)}

/* ================= NAVEGACIÓN ================= */
let si=-1,bi=0,vh=346,vtok=0;
function setView(h,now){if(Math.abs(h-vh)<.1)return;const my=++vtok;if(now){vh=h;$('stage').setAttribute('viewBox',`0 0 400 ${h}`);return}
  const from=vh,t0=performance.now();(function f(t){if(my!==vtok)return;const p=Math.min(1,(t-t0)/650);vh=from+(h-from)*ease(p);$('stage').setAttribute('viewBox',`0 0 400 ${vh.toFixed(1)}`);if(p<1)requestAnimationFrame(f)})(t0)}
function fit(){const p=$('panel'),i=$('pin');let z=1;i.style.setProperty('--fz',z);while(i.scrollHeight>p.clientHeight+1&&z>.6){z-=.03;i.style.setProperty('--fz',z)}}
function renderSlide(s){
  const c=S[s];
  $('pin').innerHTML=c.cover?c.html:`<p class="kick" style="--c:${c.col}"><i></i>${c.n}</p><h2>${c.t}</h2>${c.lead?`<p class="lead">${c.lead}</p>`:''}${c.who?c.who.replace('class="who"',`class="who" style="--c:${c.col}"`):''}<div style="--c:${c.col}">${c.body||''}</div>`;
  $('part').textContent=c.part;$('cnt').textContent=String(s+1).padStart(2,'0')+' / '+S.length;
  $('bar').style.width=((s+1)/S.length*100)+'%';
  document.querySelectorAll('#stage .st').forEach(e=>{let on=true;
    if(e.dataset.r){const [a,b]=e.dataset.r.split('-').map(Number);on=s>=a&&s<=b}else if(e.dataset.ch)on=s>=+e.dataset.ch;
    e.classList.toggle('on',on)});
  fit();
}
function resetScene(){
  $('packets').innerHTML='';ctxClear();['mring','sr0','sr1'].forEach(id=>$(id).classList.remove('on'));
  [0,1].forEach(i=>{$('sb'+i).setAttribute('height',0);$('sb'+i).setAttribute('y',(i?184:124)+16)});
  $('deny').style.display='none';$('gateR').setAttribute('fill',K.card);$('gateT').style.fill=K.perm;live(false);loopHi(-1);
}
async function goTo(s,b,animate=true){
  s=Math.max(0,Math.min(S.length-1,s));b=Math.max(0,Math.min(S[s].beats.length-1,b));
  tok++;const my=tok;
  if(s!==si)renderSlide(s);
  si=s;bi=b;
  resetScene();tl(-1);rv(0);
  setView(s>=7?448:346,!animate);
  $('beats').innerHTML=S[s].beats.length>1?S[s].beats.map((_,k)=>`<i class="${k<=b?'on':''}"></i>`).join(''):'';
  history.replaceState(null,'',`#${s+1}.${b+1}`);
  try{
    FAST=true;for(let k=0;k<b;k++)await S[s].beats[k]();
    if(!animate){await S[s].beats[b]();return}
    FAST=false;await sleep(250);await S[s].beats[b]();
  }catch(e){if(e!=='x')console.error(e)}finally{if(my===tok)FAST=false}
}
const next=()=>{if(bi<S[si].beats.length-1)goTo(si,bi+1);else if(si<S.length-1)goTo(si+1,0)};
const prev=()=>{if(bi>0)goTo(si,bi-1,false);else if(si>0)goTo(si-1,S[si-1].beats.length-1,false)};
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter','n','N'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace','p','P'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home')goTo(0,0);else if(k==='End')goTo(S.length-1,0);
  else if(k==='r'||k==='R')goTo(si,bi);
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
});
$('deck').addEventListener('click',e=>{if(e.target.closest('#nav'))return;next()});
$('bPrev').onclick=e=>{e.stopPropagation();prev()};$('bNext').onclick=e=>{e.stopPropagation();next()};
function scale(){document.documentElement.style.setProperty('--k',Math.min(innerWidth/1600,innerHeight/900));
}
addEventListener('resize',scale);scale();
const m=location.hash.match(/^#(\d+)(?:\.(\d+))?/);
document.fonts.ready.then(()=>fit());
goTo(m?+m[1]-1:0,m&&m[2]?+m[2]-1:0,!m);
</script>
