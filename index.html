<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anatomía de un belt · SDG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--code:#0E1A33;--card:#F3F6FA;--card2:#F7F9FC;--line:#D9E1EA;--txt:#253547;--lav:#3F5066;--mute:#7A8899;--turq:#1DC8DF;--turqT:#0B8FA3;--blue:#2A66DD;--dark:#10213A;--navy:#00123B;
--sys:#97A6B8;--tool:#8A99AB;--perm:#E5484D;--instr:#1DC8DF;--cmd:#F2B233;--skill:#753BBD;--sub:#FF7AB6;--mcp:#2A66DD;--hook:#F07D2E;
--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--k:1;--mc:#1DC8DF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;display:grid;place-items:center;font-family:var(--sans);-webkit-user-select:none;user-select:none}
#deck{position:relative;flex:none;width:1600px;height:900px;zoom:var(--k);background:var(--bg);color:var(--lav);overflow:hidden;cursor:pointer}
#top{position:absolute;inset:0 0 auto 0;height:64px;display:flex;align-items:center;gap:16px;padding:0 40px;background:#fff;border-bottom:1px solid var(--line);color:var(--txt);font:700 18px/1 var(--sans);z-index:10;transition:background .3s}
#top .lg{height:30px}#top .lgw{display:none}
#top .brand{padding-left:16px;border-left:1px solid var(--line)}
#deck.dark #top{background:transparent;border-color:transparent;color:#fff}
#deck.dark #top .lgd{display:none}#deck.dark #top .lgw{display:block}
#deck.dark #top .brand{border-color:rgba(255,255,255,.25)}
#part{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:10px}
#part span{padding:7px 14px;border-radius:99px;font:700 13px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#9AA7B6;border:1px solid var(--line)}
#part span.on{color:#fff;background:var(--mc);border-color:var(--mc)}
#part span.done{color:var(--txt);border-color:#B9C5D3}
#deck.dark #part span{color:rgba(255,255,255,.45);border-color:rgba(255,255,255,.2)}#deck.dark #part span.done{color:rgba(255,255,255,.8)}#deck.dark #part span.on{color:#fff}
#right{margin-left:auto;display:flex;align-items:center;gap:18px}
.lc{font:500 15px/1 var(--sans);color:var(--blue)}.lc b{color:var(--txt);font-weight:800}#deck.dark .lc b{color:#fff}
#beats{display:flex;gap:6px}
#beats i{width:8px;height:8px;border-radius:50%;background:var(--line)}
#beats i.on{background:var(--mc)}
#cnt{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:700;font-size:16px}
#nav{display:flex;gap:6px}
#nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--txt);font:700 18px/1 var(--sans);cursor:pointer}
#nav button:hover{background:var(--card)}
#deck.dark #nav button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
#bar{position:absolute;left:0;top:63px;height:3px;background:var(--mc);transition:width .4s;z-index:11}
#task{position:absolute;left:730px;top:82px;display:flex;align-items:center;gap:10px;font:600 14px/1 var(--sans);color:var(--lav)}
#task b{padding:4px 8px;border-radius:6px;background:#E6F8FB;color:var(--turqT);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#stage{position:absolute;left:40px;top:80px;width:640px;height:706px}
#panel{position:absolute;left:730px;top:114px;width:830px;height:666px;overflow:hidden}
#pin{--fz:1;font-size:calc(24px*var(--fz))}
#cap{position:absolute;left:40px;top:800px;width:1520px;height:74px;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--card);border:1px solid var(--line);border-radius:14px}
#capWho{flex:none;padding:6px 12px;border-radius:8px;font:800 15px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
#capTxt{font:600 24px/1.3 var(--sans);color:var(--txt)}
.kick{display:flex;align-items:center;gap:.5em;margin:0 0 .6em;font-weight:700;font-size:.66em;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kick i{width:.8em;height:.8em;border-radius:.2em;background:var(--c);flex:none}
h1,h2{font-weight:800;letter-spacing:-.025em;margin:0 0 .4em;color:var(--txt)}
h1{font-size:2.9em;line-height:1.02}
h1 em,h2 em{font-style:normal;color:var(--blue)}
h2{font-size:2em;line-height:1.08}
p{margin:0 0 .7em}
.lead{font-size:1em;line-height:1.5;color:var(--lav)}
.big{font-size:1.3em;line-height:1.35;font-weight:600;color:var(--txt);margin:.2em 0 .8em}
.big b{color:var(--blue)}
.who{display:flex;flex-wrap:wrap;gap:.45em;margin:0 0 .8em;font-size:.75em;font-weight:500}
.who span{padding:.35em .7em;border:1px solid var(--line);border-radius:.5em;background:var(--card2)}
.who b{color:var(--c);filter:brightness(.8)}
.note{padding:.55em .9em;border-left:4px solid var(--c);border-radius:0 .6em .6em 0;background:var(--card);font-size:.88em;line-height:1.45;font-weight:500;color:var(--txt)}
.note b{color:var(--c);filter:brightness(.8)}
.ex{margin:0 0 .8em;padding:.7em .95em;background:var(--code);border-radius:.6em;font:.72em/1.55 var(--mono);color:#D6E0F0;white-space:pre-wrap}
.ex .l{display:block;margin-bottom:.35em;font:700 .85em/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--turq)}
.ex .bad{color:#FF8A8E}
.rv{opacity:.2;transition:opacity .35s}.rv.on{opacity:1}
.list{list-style:none;margin:0 0 .9em;padding:0;counter-reset:r}
.list li{counter-increment:r;display:flex;gap:.7em;align-items:center;padding:.5em 0;border-top:1px solid var(--line);font-size:.95em;font-weight:600;color:var(--txt)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list li:before{content:counter(r);flex:none;width:1.45em;height:1.45em;display:grid;place-items:center;border-radius:.35em;background:var(--blue);color:#fff;font-size:.8em;font-weight:800}
.list li small{display:block;font-weight:500;color:var(--mute);font-size:.8em}
.files{border-radius:.7em;overflow:hidden;background:var(--code)}
.tabs{display:flex;background:#09122A}
.tabs span{padding:.55em .9em;font:600 .62em/1.2 var(--mono);color:#7F8EA8;border-right:1px solid #1C2A48}
.tabs span.on{color:#fff;background:var(--code);box-shadow:inset 0 2px 0 var(--c)}
.code{margin:0;padding:.8em 1em;font:.66em/1.6 var(--mono);color:#D6E0F0;white-space:pre-wrap;min-height:13.5em}
.code .h{color:var(--c);font-weight:700}.code .m{color:#7F8EA8}
.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 .8em;font-size:.7em;line-height:1.35;background:#fff;border:1px solid var(--line);border-radius:.6em;overflow:hidden}
.tbl th{text-align:left;padding:.6em .7em;background:var(--navy);color:#fff;font-size:.85em;letter-spacing:.08em;text-transform:uppercase}
.tbl td{padding:.55em .7em;border-top:1px solid var(--line);vertical-align:top;color:var(--lav)}
.tbl td:first-child{font-weight:700;white-space:nowrap;color:var(--txt)}
.tbl i{display:inline-block;width:.65em;height:.65em;margin-right:.5em;border-radius:.15em;background:var(--c)}
.tbl code{font:.95em var(--mono);color:var(--blue)}
.close{margin-top:1.4em}
.close p{font-size:2.3em;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--txt);margin:0 0 .55em;animation:up .6s both}
.close span{color:var(--c)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#chap.on{display:block}
#chap .num{position:absolute;left:110px;top:170px;font:800 380px/1 var(--sans);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:3px var(--mc);animation:up .7s both}
#chap .txt{position:absolute;left:560px;top:230px;width:900px;animation:up .7s .15s both}
#chap .of{font:700 18px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mc)}
#chap h1{margin:.35em 0 .3em;font-size:92px;line-height:1;color:#fff;letter-spacing:-.03em}
#chap .sub{font:500 30px/1.35 var(--sans);color:#CED9E5;margin:0 0 1.2em}
#chap .items{display:flex;flex-wrap:wrap;gap:12px}
#chap .items span{padding:10px 18px;border:1px solid color-mix(in srgb,var(--mc) 70%,transparent);background:rgba(255,255,255,.04);border-radius:10px;font:600 20px/1 var(--sans);color:#fff}
#chap .enc{margin-top:28px;font:500 20px/1.4 var(--sans);color:#A9B8CC}#chap .enc b{color:#fff}
#chap .road{position:absolute;left:110px;right:110px;bottom:70px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
#chap .road div{padding-top:16px;border-top:6px solid rgba(255,255,255,.12);font:700 18px/1.3 var(--sans);color:rgba(255,255,255,.4)}
#chap .road div b{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
#chap .road div.done{border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.75)}
#chap .road div.on{border-color:var(--mc);color:#fff}#chap .road div.on b{color:var(--mc)}
#chap .cov{position:absolute;left:120px;top:190px;width:820px;font-size:24px;animation:up .7s both}
#chap .cov .kick{color:#9FB2CC;font-size:16px}
#chap .cov h1{font-size:104px;line-height:1;color:#fff;margin:.25em 0 .35em}
#chap .cov h1 em{color:var(--blue);font-weight:500}
#chap .cov .lead{font-size:26px;color:#CED9E5}
#chap .cov .note{background:rgba(255,255,255,.06);color:#fff;border-left-color:var(--turq)}#chap .cov .note b{color:var(--turq);filter:none}
#chap .cov .list li{color:#fff;border-color:rgba(255,255,255,.15)}
/* tarea real */
#case .trk{display:flex;gap:.5em;margin:.2em 0 1.4em}
#case .trk i{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.75em;border:2px solid var(--line);color:var(--mute);background:#fff}
#case .trk i.done{background:var(--c);border-color:var(--c);color:#fff}
#case .trk i.now{border-color:var(--c);color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
#case .ck{font-weight:800;font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--c);filter:brightness(.85)}
#case .ct{margin:.2em 0 .45em;font-size:2.6em;line-height:1.05;font-weight:800;letter-spacing:-.025em;color:var(--txt)}
#case .ct.q{font-size:2em;line-height:1.15;color:var(--blue)}
#case .cd{font-size:1.35em;line-height:1.45;font-weight:500;color:var(--txt);margin:0 0 .9em}
#case .cp{display:inline-block;padding:.45em .8em;border-radius:.5em;background:color-mix(in srgb,var(--c) 12%,#fff);border:1px solid var(--c);font-size:.95em;color:var(--txt)}
#case .cp b{color:var(--c);filter:brightness(.8)}
#case .res{margin-top:1em;padding:.8em 1em;border-radius:.6em;background:#E6F8FB;border:1px solid var(--turq);font-size:1.05em;font-weight:600;color:var(--txt)}
/* escena */
.st{opacity:0;transition:opacity .55s}.st.on{opacity:1}
#stage.focus .st.on{opacity:.14}#stage.focus .st.on.fx{opacity:1}
.pl{animation:pl .45s ease-in-out 2;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.08)}}
.ln{fill:none;stroke:#8A99AB;stroke-width:1.5;stroke-dasharray:3 4;opacity:.7}
.ln.live{stroke:var(--mcp);stroke-width:2.4;opacity:1;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.la{fill:none;stroke:#5B6B80;stroke-width:2;marker-end:url(#ah)}
.ring{opacity:0;transition:opacity .2s;transform-box:fill-box;transform-origin:center}
.ring.on{opacity:1;animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cb{transition:transform .4s cubic-bezier(.3,.8,.3,1)}

</style>
</head>

let tok=0,FAST=false;
const sleep=ms=>{const t=tok;if(FAST)return t===tok?Promise.resolve():Promise.reject('x');return new Promise((r,j)=>setTimeout(()=>t===tok?r():j('x'),ms))};
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function fly(a,b,label,col,ms=1000){
  if(FAST)return sleep(0);
  a=P[a]||a;b=P[b]||b;
  const my=tok,g=document.createElementNS(NS,'g'),w=label.length*6+24,h=20,lt=col===K.card;
  g.innerHTML=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="7" fill="${col}"${lt?` stroke="${K.ink}" stroke-width="1.2"`:''}/>`+
   `<text y="3.8" text-anchor="middle" style="font:700 10.5px var(--sans);fill:${lt?K.ink:ON(col)}">${label}</text>`;
  g.setAttribute('transform',`translate(${a.x},${a.y})`);$('packets').appendChild(g);
  return new Promise((res,rej)=>{const t0=performance.now();(function f(t){
    if(my!==tok){g.remove();return rej('x')}
    const p=Math.min(1,(t-t0)/ms),e=ease(p),arc=-Math.sin(Math.PI*p)*18;
    g.setAttribute('transform',`translate(${a.x+(b.x-a.x)*e},${a.y+(b.y-a.y)*e+arc})`);
    if(p<1)requestAnimationFrame(f);else{g.remove();res()}})(t0)});
}

const CTX={list:[],top:130,bot:318,x:28,w:108};
function ctxPush(k,label,c,h=16,soft=false){
  const g=document.createElementNS(NS,'g');g.setAttribute('class','cb');
  g.innerHTML=`<rect width="${CTX.w}" height="${h}" rx="3.5" fill="${c}" fill-opacity="${soft?.2:1}" stroke="${c}" stroke-width="1.5"/><text x="${CTX.w/2}" y="${h/2+3.2}" text-anchor="middle" style="font:700 9.5px var(--sans);fill:${soft?K.ink:ON(c)}">${label}</text>`;
  $('ctxblocks').appendChild(g);CTX.list.push({k,h,el:g,rect:g.firstChild,txt:g.lastChild});
  ctxRender();if(!FAST)g.animate([{opacity:0},{opacity:1}],{duration:380});
}
function ctxRender(){
  const gap=3,tot=CTX.list.reduce((s,b)=>s+b.h+gap,0),avail=CTX.bot-CTX.top,k=Math.min(1,avail/(tot||1));
  let y=CTX.top;CTX.list.forEach(b=>{const h=Math.max(5,b.h*k);b.el.style.transform=`translate(${CTX.x}px,${y}px)`;
    b.rect.setAttribute('height',h);b.txt.setAttribute('y',h/2+3.3);b.txt.style.opacity=h<11?0:1;y+=h+gap*k});
  const pct=Math.min(100,Math.round(tot/avail*100));$('ctxpct').textContent=pct+' %';$('ctxmeter').setAttribute('width',108*pct/100);
}
function ctxClear(){CTX.list=[];$('ctxblocks').innerHTML='';ctxRender()}

/* ================= NAVEGACIÓN ================= */
let si=-1,bi=0,vh=346,vtok=0;
function setView(h,now){if(Math.abs(h-vh)<.1)return;const my=++vtok;if(now){vh=h;$('stage').setAttribute('viewBox',`0 0 400 ${h}`);return}
  const from=vh,t0=performance.now();(function f(t){if(my!==vtok)return;const p=Math.min(1,(t-t0)/650);vh=from+(h-from)*ease(p);$('stage').setAttribute('viewBox',`0 0 400 ${vh.toFixed(1)}`);if(p<1)requestAnimationFrame(f)})(t0)}
function fit(){const p=$('panel'),i=$('pin');let z=1;i.style.setProperty('--fz',z);while(i.scrollHeight>p.clientHeight+1&&z>.6){z-=.03;i.style.setProperty('--fz',z)}}
const MC=['#1DC8DF','#2A66DD','#1DC8DF','#8E5BD6'],MN=['Motor','Piezas','Tarea real'];
function renderSlide(s){
  const c=S[s];document.documentElement.style.setProperty('--mc',MC[c.mom]||MC[0]);
  const d=c.divider;$('deck').classList.toggle('dark',!!(d||c.cover));$('chap').classList.toggle('on',!!(d||c.cover));$('chap').classList.toggle('cv',!!c.cover);$('cap').style.visibility=d||c.cover?'hidden':'visible';
  if(c.cover)$('chap').innerHTML=`<div class="cov">${c.html}</div>`;
  if(d)$('chap').innerHTML=`<div class="num">0${d.n}</div><div class="txt"><div class="of">Momento ${d.n} de 3</div><h1>${d.t}</h1><p class="sub">${d.sub}</p><div class="items">${d.items.map(x=>`<span>${x}</span>`).join('')}</div>${d.enc?'<p class="enc">El encargo: <b>modelo semántico de Ventas de Retail Norte en Power BI</b></p>':''}</div><div class="road">${MN.map((x,i)=>`<div class="${+d.n===i+1?'on':+d.n>i+1?'done':''}"><b>Momento ${i+1}</b>${x}</div>`).join('')}</div>`;$('task').style.visibility=c.cover||d?'hidden':'visible';$('panel').style.visibility=c.cover?'hidden':'visible';
  $('pin').innerHTML=c.cover?c.html:`<p class="kick" style="--c:${c.col}"><i></i>${c.n}</p>${c.t?`<h2>${c.t}</h2>`:''}${c.lead?`<p class="lead">${c.lead}</p>`:''}<div style="--c:${c.col}">${c.body||''}</div>`;
  $('part').innerHTML=['Motor','Piezas','Tarea real'].map((t,i)=>`<span class="${c.mom===i+1?'on':c.mom>i+1?'done':''}">${i+1} · ${t}</span>`).join('');
  $('cnt').textContent=String(s+1).padStart(2,'0')+' / '+S.length;
  $('bar').style.width=((s+1)/S.length*100)+'%';
  if($('pin').querySelector('.tabs'))tab(0);
  fit();
}
function visScene(s,b){
  document.querySelectorAll('#stage .st').forEach(e=>{let on=true;
    if(e.dataset.r){const [a,z]=e.dataset.r.split('-').map(Number);on=s>=a&&s<=z}
    else if(e.dataset.ch){const ch=+e.dataset.ch;on=s>ch||(s===ch&&b>=(+e.dataset.b||0))}
    e.classList.toggle('on',on)});
  SLOTS.forEach((x,i)=>$('ph'+i).style.opacity=$('s-'+x[0]).classList.contains('on')?0:1);
}
function resetScene(){
  $('packets').innerHTML='';ctxClear();['mring','sr0','sr1'].forEach(id=>$(id).classList.remove('on'));
  [0,1].forEach(i=>{$('sb'+i).setAttribute('height',0);$('sb'+i).setAttribute('y',(i?184:124)+16)});
  $('deny').style.display='none';$('okm').style.display='none';$('gateR').setAttribute('fill',K.card);$('gateT').style.fill=K.perm;live(false);loopHi(-1);focus(null);
}
async function goTo(s,b,animate=true){
  s=Math.max(0,Math.min(S.length-1,s));b=Math.max(0,Math.min(S[s].beats.length-1,b));
  tok++;const my=tok;
  if(s!==si)renderSlide(s);
  si=s;bi=b;
  resetScene();tl(-1);rv(0);visScene(s,b);
  setView(s>=IX.belt?458:346,!animate);
  $('beats').innerHTML=S[s].beats.length>1?S[s].beats.map((_,k)=>`<i class="${k<=b?'on':''}"></i>`).join(''):'';
  history.replaceState(null,'',`#${s+1}.${b+1}`);
  try{
    FAST=true;for(let k=0;k<b;k++)await S[s].beats[k]();
    if(!animate){await S[s].beats[b]();return}
    FAST=false;await sleep(200);await S[s].beats[b]();
  }catch(e){if(e!=='x')console.error(e)}finally{if(my===tok)FAST=false}
}
const next=()=>{if(bi<S[si].beats.length-1)goTo(si,bi+1);else if(si<S.length-1)goTo(si+1,0)};
const prev=()=>{if(bi>0)goTo(si,bi-1,false);else if(si>0)goTo(si-1,S[si-1].beats.length-1,false)};
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter','n','N'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace','p','P'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home')goTo(0,0);else if(k==='End')goTo(S.length-1,0);
  else if(k==='r'||k==='R')goTo(si,bi);
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
});
$('deck').addEventListener('click',e=>{if(e.target.closest('#nav'))return;next()});
$('bPrev').onclick=e=>{e.stopPropagation();prev()};$('bNext').onclick=e=>{e.stopPropagation();next()};
function scale(){document.documentElement.style.setProperty('--k',Math.min(innerWidth/1600,innerHeight/900))}
addEventListener('resize',scale);scale();
const m=location.hash.match(/^#(\d+)(?:\.(\d+))?/);
document.fonts.ready.then(()=>fit());
goTo(m?+m[1]-1:0,m&&m[2]?+m[2]-1:0,!m);
</script>
