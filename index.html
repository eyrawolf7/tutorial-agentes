<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anatomía de un belt · SDG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1B31;--bg2:#17152A;--card:#28253F;--card2:#221F38;--line:#3A3658;--txt:#F4F6FF;--lav:#D1D8ED;--mute:#9A9CB8;--turq:#00E6D9;--blue:#3366FF;--dark:#1E1B31;
--sys:#8C8FB0;--tool:#D1D8ED;--perm:#FF4D56;--instr:#00E6D9;--cmd:#F7C948;--skill:#8B8DF7;--sub:#FF7AB6;--mcp:#4FA3FF;--hook:#FF9F43;
--sans:"Figtree","Sofia Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--k:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;display:grid;place-items:center;font-family:var(--sans);-webkit-user-select:none;user-select:none}
#deck{position:relative;flex:none;width:1600px;height:900px;zoom:var(--k);background:var(--bg);color:var(--lav);overflow:hidden;cursor:pointer}
#top{position:absolute;inset:0 0 auto 0;height:60px;display:flex;align-items:center;padding:0 40px;background:#000;color:#fff;font:600 19px/1 var(--sans)}
#top .brand b{color:var(--turq);font-weight:800}
#part{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:10px}
#part span{padding:7px 14px;border-radius:99px;font:700 13px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#5E5B7E;border:1px solid #2A2745}
#part span.on{color:var(--dark);background:var(--mc,var(--turq));border-color:var(--mc,var(--turq))}
#part span.done{color:var(--lav);border-color:#4A4670}
#right{margin-left:auto;display:flex;align-items:center;gap:18px}
#beats{display:flex;gap:6px}
#beats i{width:8px;height:8px;border-radius:50%;background:#3A3658}
#beats i.on{background:var(--turq)}
#cnt{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:700}
#nav{display:flex;gap:6px}
#nav button{width:34px;height:34px;border-radius:9px;border:1px solid #3A3658;background:#141226;color:var(--lav);font:700 18px/1 var(--sans);cursor:pointer}
#nav button:hover{background:var(--card)}
#bar{position:absolute;left:0;top:60px;height:3px;background:var(--mc,var(--turq));transition:width .4s}
#task{position:absolute;left:730px;top:76px;display:flex;align-items:center;gap:10px;font:600 14px/1 var(--sans);color:var(--lav)}
#task b{padding:4px 8px;border-radius:6px;background:rgba(0,230,217,.12);color:var(--turq);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#stage{position:absolute;left:40px;top:78px;width:640px;height:706px}
#panel{position:absolute;left:730px;top:110px;width:830px;height:670px;overflow:hidden}
#pin{--fz:1;font-size:calc(24px*var(--fz))}
#cap{position:absolute;left:40px;top:800px;width:1520px;height:74px;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--card);border:1px solid var(--line);border-radius:14px}
#capWho{flex:none;padding:6px 12px;border-radius:8px;font:800 15px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
#capTxt{font:500 24px/1.3 var(--sans);color:var(--txt)}
.kick{display:flex;align-items:center;gap:.5em;margin:0 0 .6em;font-weight:700;font-size:.66em;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kick i{width:.8em;height:.8em;border-radius:.2em;background:var(--c);flex:none}
h1,h2{font-weight:800;letter-spacing:-.025em;margin:0 0 .4em;color:#fff}
h1{font-size:2.9em;line-height:1.02}
h1 em,h2 em{font-style:normal;color:var(--c,var(--turq))}
h2{font-size:2em;line-height:1.08}
p{margin:0 0 .7em}
.lead{font-size:1em;line-height:1.5;color:var(--lav)}
.big{font-size:1.3em;line-height:1.35;font-weight:600;color:#fff;margin:.2em 0 .8em}
.big b{color:var(--turq)}
.who{display:flex;flex-wrap:wrap;gap:.45em;margin:0 0 .8em;font-size:.75em;font-weight:500}
.who span{padding:.35em .7em;border:1px solid var(--line);border-radius:.5em;background:var(--card2)}
.who b{color:var(--c)}
.note{padding:.55em .9em;border-left:4px solid var(--c);border-radius:0 .6em .6em 0;background:var(--card2);font-size:.88em;line-height:1.45;font-weight:500;color:var(--txt)}
.note b{color:var(--c)}
.ex{margin:0 0 .8em;padding:.7em .95em;background:var(--bg2);border:1px solid var(--line);border-radius:.6em;font:.72em/1.55 var(--mono);color:var(--lav);white-space:pre-wrap}
.ex .l{display:block;margin-bottom:.35em;font:700 .85em/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--turq)}
.ex .bad{color:var(--perm)}
.rv{opacity:.18;transition:opacity .35s}.rv.on{opacity:1}
.list{list-style:none;margin:0 0 .9em;padding:0;counter-reset:r}
.list li{counter-increment:r;display:flex;gap:.7em;align-items:center;padding:.5em 0;border-top:1px solid var(--line);font-size:.95em;font-weight:600;color:var(--txt)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list li:before{content:counter(r);flex:none;width:1.45em;height:1.45em;display:grid;place-items:center;border-radius:.35em;background:var(--turq);color:var(--dark);font-size:.8em;font-weight:800}
.list li small{display:block;font-weight:500;color:var(--mute);font-size:.8em}
/* visor de archivos */
.files{border:1px solid var(--line);border-radius:.7em;overflow:hidden;background:var(--bg2)}
.tabs{display:flex;background:#120F22;border-bottom:1px solid var(--line)}
.tabs span{padding:.55em .9em;font:600 .62em/1.2 var(--mono);color:var(--mute);border-right:1px solid var(--line)}
.tabs span.on{color:#fff;background:var(--bg2);box-shadow:inset 0 2px 0 var(--c)}
.code{margin:0;padding:.8em 1em;font:.66em/1.6 var(--mono);color:var(--lav);white-space:pre-wrap;min-height:13.5em}
.code .h{color:var(--c);font-weight:700}.code .m{color:var(--mute)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 .8em;font-size:.7em;line-height:1.35;background:var(--card2);border:1px solid var(--line);border-radius:.6em;overflow:hidden}
.tbl th{text-align:left;padding:.55em .7em;background:var(--bg2);color:var(--turq);font-size:.85em;letter-spacing:.08em;text-transform:uppercase}
.tbl td{padding:.55em .7em;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;white-space:nowrap;color:var(--txt)}
.tbl i{display:inline-block;width:.65em;height:.65em;margin-right:.5em;border-radius:.15em;background:var(--c)}
.tbl code{font:.95em var(--mono);color:var(--lav)}
.tl{list-style:none;margin:0 0 .8em;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.35em}
.tl li{display:flex;gap:.5em;align-items:center;padding:.4em .7em;border:1px solid var(--line);border-radius:.45em;font-size:.72em;font-weight:600;opacity:.35;transition:.25s}
.tl li i{flex:none;width:.6em;height:.6em;border-radius:.15em;background:var(--c)}
.tl li b{color:var(--mute);font-weight:700;margin-right:.1em}
.tl li.on{opacity:1;background:var(--card);border-color:var(--c);color:var(--txt)}
.close{margin-top:1.4em}
.close p{font-size:2.3em;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:#fff;margin:0 0 .55em;animation:up .6s both}
.close p:nth-child(2){animation-delay:.5s}.close p:nth-child(3){animation-delay:1s}
.close span{color:var(--c)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#chap{position:absolute;left:0;top:63px;width:1600px;height:837px;background:radial-gradient(900px 600px at 20% 40%,color-mix(in srgb,var(--mc) 14%,transparent),transparent 70%),var(--bg);display:none;z-index:5}
#chap.on{display:block}
#chap .num{position:absolute;left:110px;top:120px;font:800 380px/1 var(--sans);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:3px var(--mc);opacity:.9;animation:up .7s both}
#chap .txt{position:absolute;left:560px;top:190px;width:900px;animation:up .7s .15s both}
#chap .of{font:700 18px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mc)}
#chap h1{margin:.35em 0 .3em;font-size:92px;line-height:1;color:#fff;letter-spacing:-.03em}
#chap .sub{font:500 30px/1.35 var(--sans);color:var(--lav);margin:0 0 1.2em}
#chap .items{display:flex;flex-wrap:wrap;gap:12px}
#chap .items span{padding:10px 18px;border:1px solid color-mix(in srgb,var(--mc) 55%,transparent);border-radius:10px;font:600 20px/1 var(--sans);color:var(--txt)}
#chap .enc{margin-top:28px;font:500 20px/1.4 var(--sans);color:var(--mute)}#chap .enc b{color:#fff}
#chap .road{position:absolute;left:110px;right:110px;bottom:70px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
#chap .road div{padding-top:16px;border-top:6px solid #2E2A4A;font:700 18px/1.3 var(--sans);color:#5E5B7E}
#chap .road div b{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
#chap .road div.done{border-color:#4A4670;color:var(--lav)}
#chap .road div.on{border-color:var(--mc);color:#fff}#chap .road div.on b{color:var(--mc)}
/* escena */
.st{opacity:0;transition:opacity .55s}.st.on{opacity:1}
.pl{animation:pl .45s ease-in-out 2;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.08)}}
.ln{fill:none;stroke:var(--lav);stroke-width:1.5;stroke-dasharray:3 4;opacity:.4}
.ln.live{stroke:var(--mcp);stroke-width:2.4;opacity:1;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.la{fill:none;stroke:var(--lav);stroke-width:2;marker-end:url(#ah)}
.ring{opacity:0;transition:opacity .2s;transform-box:fill-box;transform-origin:center}
.ring.on{opacity:1;animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cb{transition:transform .4s cubic-bezier(.3,.8,.3,1)}
</style>
</head>
<body>
<div id="deck">
  <div id="top"><span class="brand"><b>SDG</b> · Anatomía de un belt</span><div id="part"></div>
    <div id="right"><div id="beats"></div><span id="cnt"></span><div id="nav"><button id="bPrev" aria-label="Anterior">‹</button><button id="bNext" aria-label="Siguiente">›</button></div></div></div>
  <i id="bar"></i>
  <svg id="stage" viewBox="0 0 400 346" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama animado de un modelo de IA dentro de un harness y las piezas de un belt"></svg>
  <div id="task"><b>El encargo de toda la guía</b>Modelo semántico de Ventas de Retail Norte en Power BI</div>
  <div id="panel"><div id="pin"></div></div>
  <div id="chap"></div>
  <div id="cap"><span id="capWho"></span><span id="capTxt"></span></div>
</div>

<script>
const K={ink:'#E8EBFA',dark:'#1E1B31',card:'#2B2846',hz:'#23203A',tray:'#211E37',edge:'#4A4670',mute:'#8C8FB0',model:'#3366FF',
 sys:'#8C8FB0',tool:'#D1D8ED',perm:'#FF4D56',instr:'#00E6D9',cmd:'#F7C948',skill:'#8B8DF7',sub:'#FF7AB6',mcp:'#4FA3FF',hook:'#FF9F43'};
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);

/* Índices de diapositiva, para decidir qué se ve en el diagrama */
const IX={model:2,harness:3,tools:4,belt:6,instr:7,cmd:8,skill:9,mcp:10,hook:11,caso:13,sub:99};

/* ================= ESCENA ================= */
const R=(x,y,w,h,o={})=>{const {f=K.card,s=K.edge,sw=1.5,r=8,dash='',id=''}=o;
 return `<rect${id?` id="${id}"`:''} x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"${dash?` stroke-dasharray="${dash}"`:''}/>`};
const T=(x,y,t,o={})=>{const {fs=11,w=700,c=K.ink,a='middle',ls=0,id=''}=o;
 return `<text${id?` id="${id}"`:''} x="${x}" y="${y}" text-anchor="${a}" style="font:${w} ${fs}px var(--sans);fill:${c};letter-spacing:${ls}em">${t}</text>`};
const chip=(id,t,x,w,c=K.tool)=>`<g id="c-${id}">${R(x,280,w,26,{s:c,r:6})}${T(x+w/2,297,t,{fs:10.5})}</g>`;
const SYS=[['snow','Snowflake',150],['pbi','Power BI',212],['git','Git',274],['teams','Teams',336]];
const SLOTS=[['instr','Instrucciones','siempre activas',K.instr],['cmd','Comandos','los lanzas tú',K.cmd],['skill','Skills','las elige el modelo',K.skill],
['mcp','MCP','conecta sistemas',K.mcp],['hook','Hooks','saltan solos',K.hook]];
const sXY=i=>({x:16+(i%3)*124,y:368+Math.floor(i/3)*36});
const pill=(id,x,y,t)=>`<g id="${id}"><rect x="${x-33}" y="${y-9}" width="66" height="18" rx="9" fill="${K.card}" stroke="${K.edge}" stroke-width="1.5"/>${T(x,y+3.5,t,{fs:9,ls:.1})}</g>`;

$('stage').innerHTML=`
<defs><marker id="ah" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="${K.ink}"/></marker></defs>
<g class="st" data-ch="${IX.model}">${T(271,12,'SISTEMAS DEL CLIENTE',{fs:8.5,ls:.12,c:K.mute})}
${SYS.map(([id,n,x])=>`<g id="sy-${id}">${R(x,20,58,32,{s:K.mcp,r:7})}${T(x+29,40,n,{fs:10.5})}</g>`).join('')}</g>
<g class="st" data-r="${IX.model}-${IX.mcp-1}"><path d="M238 124 L186 56" fill="none" stroke="${K.perm}" stroke-width="2" stroke-dasharray="4 4"/>${T(216,70,'sin acceso',{a:'start',fs:9.5,c:K.perm})}</g>
<g class="st" data-ch="${IX.harness}">${R(8,76,384,260,{f:K.hz,r:16,dash:'6 5'})}${T(382,95,'Claude Code · Copilot · Cursor',{a:'end',fs:9,c:K.mute,w:600})}</g>
<g class="st" data-r="${IX.harness}-${IX.belt-1}">${T(20,95,'HARNESS DE SERIE',{a:'start',fs:11,ls:.14})}</g>
<g class="st" data-ch="${IX.belt}">${T(20,95,'HARNESS + BELT',{a:'start',fs:11,ls:.14,c:K.instr})}</g>
<g class="st" data-r="${IX.model}-${IX.model}"><path d="M56 46 Q170 60 228 132" class="ln"/></g>
<g class="st" data-ch="${IX.harness}"><path d="M48 55 L118 103" class="ln"/><path d="M144 150 H224" class="ln"/></g>
<g class="st" data-ch="${IX.tools}"><path d="M262 188 V256" class="ln"/></g>
<g class="st" data-ch="${IX.mcp}"><path id="l-sys" d="M156 293 H150 V53" class="ln"/></g>
<g class="st" data-ch="${IX.harness}">${R(20,104,124,222,{r:9})}${T(30,119,'CONTEXTO',{a:'start',fs:9.5,ls:.12})}${T(134,119,'0 %',{a:'end',fs:9.5,id:'ctxpct',c:K.mute})}
<rect x="28" y="123" width="108" height="3" rx="1.5" fill="${K.hz}"/><rect id="ctxmeter" x="28" y="123" width="0" height="3" rx="1.5" fill="${K.ink}"/><g id="ctxblocks"></g></g>
<g class="st" data-ch="${IX.tools}">${R(156,256,228,64,{r:9})}${T(166,271,'HERRAMIENTAS',{a:'start',fs:8.5,ls:.12,c:K.mute})}
${chip('files','Archivos',164,60)}${chip('term','Terminal',228,58)}${chip('web','Web',290,42)}</g>
<g class="st" data-ch="${IX.mcp}">${chip('mcp','MCP',338,40,K.mcp)}</g>
<g class="st" data-r="${IX.tools}-${IX.tools}">
<path class="la" d="M346 120 Q380 176 356 229"/><path class="la" d="M318 250 Q262 270 216 247"/><path class="la" d="M176 226 Q170 112 282 108"/>
${pill('lp0',318,110,'DECIDE')}${pill('lp1',348,240,'EJECUTA')}${pill('lp2',184,236,'OBSERVA')}</g>
<g class="st" data-ch="${IX.sub}">${[124,184].map((cy,i)=>`<circle id="sr${i}" class="ring" cx="344" cy="${cy}" r="20" fill="none" stroke="${K.sub}" stroke-width="2" stroke-dasharray="3 5"/>
<circle cx="344" cy="${cy}" r="14" fill="${K.sub}"/>${T(344,cy+3.5,'sub',{fs:9.5,c:K.dark})}
${R(366,cy-18,18,36,{r:4})}<rect id="sb${i}" x="368" y="${cy+16}" width="14" height="0" rx="2" fill="${K.sub}"/>`).join('')}${T(350,219,'contexto propio',{fs:8,c:K.mute,w:600})}</g>
<g class="st" data-ch="${IX.tools}" data-b="3" id="g-gate"><rect id="gateR" x="216" y="219" width="92" height="22" rx="11" fill="${K.card}" stroke="${K.perm}" stroke-width="2"/>${T(262,234,'PERMISOS',{fs:9.5,c:K.perm,ls:.12,id:'gateT'})}</g>
<g class="st on">
<circle id="mring" class="ring" cx="262" cy="150" r="46" fill="none" stroke="${K.ink}" stroke-width="2.5" stroke-dasharray="3 7"/>
<circle cx="262" cy="150" r="41" fill="none" stroke="${K.model}" stroke-opacity=".35" stroke-width="4"/><circle id="mcirc" cx="262" cy="150" r="36" fill="${K.model}"/>
${T(262,156,'LLM',{fs:17,c:'#fff',ls:.06})}${T(262,204,'MODELO',{fs:9.5,ls:.14})}</g>
<g class="st on"><circle cx="34" cy="38" r="20" fill="${K.card}" stroke="${K.ink}" stroke-width="2"/><circle cx="34" cy="32" r="6.5" fill="${K.ink}"/><path d="M23 50 Q34 36 45 50Z" fill="${K.ink}"/>
${T(62,36,'TÚ',{a:'start',fs:11,ls:.12})}${T(62,50,'consultor/a',{a:'start',fs:9,c:K.mute,w:600})}</g>
<g class="st" data-ch="${IX.belt}">${R(8,344,384,98,{f:K.tray,r:16})}${T(20,360,'BELT',{a:'start',fs:11,ls:.14,c:K.instr})}${T(382,360,'modelo-semantico-pbi',{a:'end',fs:9.5,c:K.mute,w:600})}
${SLOTS.map((s,i)=>{const p=sXY(i);return `<g id="ph${i}">${R(p.x,p.y,120,32,{f:'none',s:K.mute,dash:'4 3',r:7})}${T(p.x+60,p.y+20,s[1],{fs:10.5,c:K.mute,w:600})}</g>`}).join('')}</g>
${SLOTS.map((s,i)=>{const p=sXY(i);return `<g class="st" data-ch="${IX.instr+i}" id="s-${s[0]}">${R(p.x,p.y,120,32,{r:7})}<rect x="${p.x}" y="${p.y}" width="6" height="32" rx="3" fill="${s[3]}"/>
${T(p.x+15,p.y+14,s[1],{a:'start',fs:11})}${T(p.x+15,p.y+26,s[2],{a:'start',fs:8.5,c:K.mute,w:600})}</g>`}).join('')}
<g id="deny" style="display:none"><circle r="13" fill="${K.perm}" stroke="${K.dark}" stroke-width="2"/><path d="M-5 -5l10 10M5 -5l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
<g id="okm" style="display:none"><circle r="13" fill="${K.instr}" stroke="${K.dark}" stroke-width="2"/><path d="M-6 0l4 4 8-8" fill="none" stroke="${K.dark}" stroke-width="3" stroke-linecap="round"/></g>
<g id="packets"></g>`;

/* ================= ANIMACIÓN ================= */
const P={u:{x:34,y:38},m:{x:262,y:150},ctx:{x:82,y:215},gate:{x:262,y:230},
 snow:{x:179,y:36},pbi:{x:241,y:36},git:{x:303,y:36},teams:{x:365,y:36},
 files:{x:194,y:293},term:{x:257,y:293},web:{x:311,y:293},mcpc:{x:358,y:293},s1:{x:344,y:124},s2:{x:344,y:184}};
SLOTS.forEach((s,i)=>{const p=sXY(i);P[s[0]]={x:p.x+60,y:p.y+16}});
let tok=0,FAST=false;
const sleep=ms=>{const t=tok;if(FAST)return t===tok?Promise.resolve():Promise.reject('x');return new Promise((r,j)=>setTimeout(()=>t===tok?r():j('x'),ms))};
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function fly(a,b,label,col,ms=1000){
  if(FAST)return sleep(0);
  a=P[a]||a;b=P[b]||b;
  const my=tok,g=document.createElementNS(NS,'g'),w=label.length*6+24,h=20,lt=col===K.card;
  g.innerHTML=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="7" fill="${col}"${lt?` stroke="${K.ink}" stroke-width="1.2"`:''}/>`+
   `<text y="3.8" text-anchor="middle" style="font:700 10.5px var(--sans);fill:${lt?K.ink:K.dark}">${label}</text>`;
  g.setAttribute('transform',`translate(${a.x},${a.y})`);$('packets').appendChild(g);

const CTX={list:[],top:130,bot:318,x:28,w:108};
function ctxPush(k,label,c,h=16,soft=false){
  const g=document.createElementNS(NS,'g');g.setAttribute('class','cb');
  g.innerHTML=`<rect width="${CTX.w}" height="${h}" rx="3.5" fill="${c}" fill-opacity="${soft?.2:1}" stroke="${c}" stroke-width="1.5"/><text x="${CTX.w/2}" y="${h/2+3.2}" text-anchor="middle" style="font:700 9.5px var(--sans);fill:${soft?K.ink:K.dark}">${label}</text>`;
  $('ctxblocks').appendChild(g);CTX.list.push({k,h,el:g,rect:g.firstChild,txt:g.lastChild});
  ctxRender();if(!FAST)g.animate([{opacity:0},{opacity:1}],{duration:380});
}
function ctxRender(){
  const gap=3,tot=CTX.list.reduce((s,b)=>s+b.h+gap,0),avail=CTX.bot-CTX.top,k=Math.min(1,avail/(tot||1));
  let y=CTX.top;CTX.list.forEach(b=>{const h=Math.max(5,b.h*k);b.el.style.transform=`translate(${CTX.x}px,${y}px)`;
    b.rect.setAttribute('height',h);b.txt.setAttribute('y',h/2+3.3);b.txt.style.opacity=h<11?0:1;y+=h+gap*k});
  const pct=Math.min(100,Math.round(tot/avail*100));$('ctxpct').textContent=pct+' %';$('ctxmeter').setAttribute('width',108*pct/100);
}
function ctxClear(){CTX.list=[];$('ctxblocks').innerHTML='';ctxRender()}

  async()=>{tl(6);say('hook','Antes de tocar Power BI, el hook comprueba que hay dev-spec aprobado: vía libre.');await fly('hook','mcpc','¿dev-spec?',K.hook,900);await mark('mcpc',true)},
  async()=>{tl(7);say('modelo','Siguiendo el dev-spec aprobado, crea tablas, relaciones y 18 medidas en Power BI por MCP.');await fly('m','mcpc','crear_tabla…',K.mcp,900);await fly('mcpc','pbi','18 medidas',K.mcp,1000);pulse('sy-pbi');await add('pb','Modelo en Power BI',K.mcp,14)},
  async()=>{tl(8);rv(1);say('hook','Al exportar, otro hook valida el modelo. Todo correcto: se entrega el PBIP y el dev-spec.');await fly('m','mcpc','exportar_tmdl',K.mcp,800);await fly('hook','mcpc','validar',K.hook,800);await mark('mcpc',true,900);await fly('m','u','modelo validado',K.instr,1100)}]},

/* 12 · chuleta */
{mom:3,n:'Chuleta',col:K.instr,t:'Las cinco piezas de un belt',lead:'',
 body:`<table class="tbl"><tr><th>Pieza</th><th>Qué es</th><th>La activa</th><th>En el ejemplo</th></tr>
${[['Instrucciones',K.instr,'Lo que debe saber siempre','Siempre están','<code>CLAUDE.md</code> del cliente'],['Comandos',K.cmd,'Encargos guardados','Tú, con /','<code>/crear-modelo-semantico</code>'],['Skills',K.skill,'El saber hacer, bajo demanda','El modelo','<code>modelo-semantico</code>'],['MCP',K.mcp,'Enchufes a los sistemas','El modelo los pide','Snowflake, Power BI'],['Hooks',K.hook,'Controles que no se saltan','Un evento','Exigir dev-spec aprobado']].map(([a,c,b,d,e])=>`<tr><td><i style="--c:${c}"></i>${a}</td><td>${b}</td><td>${d}</td><td>${e}</td></tr>`).join('')}</table>
 <div class="close" style="margin-top:.9em"><p style="font-size:1.35em"><span style="--c:${K.model}">El modelo</span> piensa. <span style="--c:${K.ink}">El harness</span> actúa y pone los límites. <span style="--c:${K.instr}">El belt</span> aporta el método de SDG.</p></div>`,
 beats:[async()=>{base('sys','tools','instr','skidx','mcpt');say('belt','Cinco piezas, una carpeta, el mismo método para todo el equipo.');for(const s of SLOTS)pulse('s-'+s[0])}]}
];

/* ================= NAVEGACIÓN ================= */
let si=-1,bi=0,vh=346,vtok=0;
function setView(h,now){if(Math.abs(h-vh)<.1)return;const my=++vtok;if(now){vh=h;$('stage').setAttribute('viewBox',`0 0 400 ${h}`);return}
  const from=vh,t0=performance.now();(function f(t){if(my!==vtok)return;const p=Math.min(1,(t-t0)/650);vh=from+(h-from)*ease(p);$('stage').setAttribute('viewBox',`0 0 400 ${vh.toFixed(1)}`);if(p<1)requestAnimationFrame(f)})(t0)}
function fit(){const p=$('panel'),i=$('pin');let z=1;i.style.setProperty('--fz',z);while(i.scrollHeight>p.clientHeight+1&&z>.6){z-=.03;i.style.setProperty('--fz',z)}}
const MC=['#00E6D9','#3366FF','#00E6D9','#F7C948'],MN=['Motor','Piezas','Tarea real'];
function renderSlide(s){
  const c=S[s];document.documentElement.style.setProperty('--mc',MC[c.mom]||MC[0]);
  const d=c.divider;$('chap').classList.toggle('on',!!d);$('cap').style.visibility=d?'hidden':'visible';
  if(d)$('chap').innerHTML=`<div class="num">0${d.n}</div><div class="txt"><div class="of">Momento ${d.n} de 3</div><h1>${d.t}</h1><p class="sub">${d.sub}</p><div class="items">${d.items.map(x=>`<span>${x}</span>`).join('')}</div>${d.enc?'<p class="enc">El encargo: <b>modelo semántico de Ventas de Retail Norte en Power BI</b></p>':''}</div><div class="road">${MN.map((x,i)=>`<div class="${+d.n===i+1?'on':+d.n>i+1?'done':''}"><b>Momento ${i+1}</b>${x}</div>`).join('')}</div>`;$('task').style.visibility=c.cover||d?'hidden':'visible';
  $('pin').innerHTML=c.cover?c.html:`<p class="kick" style="--c:${c.col}"><i></i>${c.n}</p>${c.t?`<h2>${c.t}</h2>`:''}${c.lead?`<p class="lead">${c.lead}</p>`:''}<div style="--c:${c.col}">${c.body||''}</div>`;
  $('part').innerHTML=['Motor','Piezas','Tarea real'].map((t,i)=>`<span class="${c.mom===i+1?'on':c.mom>i+1?'done':''}">${i+1} · ${t}</span>`).join('');
  $('cnt').textContent=String(s+1).padStart(2,'0')+' / '+S.length;
  $('bar').style.width=((s+1)/S.length*100)+'%';
  if($('pin').querySelector('.tabs'))tab(0);
  fit();
}
function visScene(s,b){
  document.querySelectorAll('#stage .st').forEach(e=>{let on=true;
    if(e.dataset.r){const [a,z]=e.dataset.r.split('-').map(Number);on=s>=a&&s<=z}
    else if(e.dataset.ch){const ch=+e.dataset.ch;on=s>ch||(s===ch&&b>=(+e.dataset.b||0))}
    e.classList.toggle('on',on)});
}
function resetScene(){
  $('packets').innerHTML='';ctxClear();['mring','sr0','sr1'].forEach(id=>$(id).classList.remove('on'));
  [0,1].forEach(i=>{$('sb'+i).setAttribute('height',0);$('sb'+i).setAttribute('y',(i?184:124)+16)});
  $('deny').style.display='none';$('okm').style.display='none';$('gateR').setAttribute('fill',K.card);$('gateT').style.fill=K.perm;live(false);loopHi(-1);
}
async function goTo(s,b,animate=true){
  s=Math.max(0,Math.min(S.length-1,s));b=Math.max(0,Math.min(S[s].beats.length-1,b));
  tok++;const my=tok;
  if(s!==si)renderSlide(s);
  si=s;bi=b;
  resetScene();tl(-1);rv(0);visScene(s,b);
  setView(s>=IX.belt?448:346,!animate);
  $('beats').innerHTML=S[s].beats.length>1?S[s].beats.map((_,k)=>`<i class="${k<=b?'on':''}"></i>`).join(''):'';
  history.replaceState(null,'',`#${s+1}.${b+1}`);
  try{
    FAST=true;for(let k=0;k<b;k++)await S[s].beats[k]();
    if(!animate){await S[s].beats[b]();return}
    FAST=false;await sleep(200);await S[s].beats[b]();
  }catch(e){if(e!=='x')console.error(e)}finally{if(my===tok)FAST=false}
}
const next=()=>{if(bi<S[si].beats.length-1)goTo(si,bi+1);else if(si<S.length-1)goTo(si+1,0)};
const prev=()=>{if(bi>0)goTo(si,bi-1,false);else if(si>0)goTo(si-1,S[si-1].beats.length-1,false)};
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter','n','N'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace','p','P'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home')goTo(0,0);else if(k==='End')goTo(S.length-1,0);
  else if(k==='r'||k==='R')goTo(si,bi);
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
});
$('deck').addEventListener('click',e=>{if(e.target.closest('#nav'))return;next()});
$('bPrev').onclick=e=>{e.stopPropagation();prev()};$('bNext').onclick=e=>{e.stopPropagation();next()};
function scale(){document.documentElement.style.setProperty('--k',Math.min(innerWidth/1600,innerHeight/900))}
addEventListener('resize',scale);scale();
const m=location.hash.match(/^#(\d+)(?:\.(\d+))?/);
document.fonts.ready.then(()=>fit());
goTo(m?+m[1]-1:0,m&&m[2]?+m[2]-1:0,!m);
</script>
